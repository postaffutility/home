<!-- Security Check: Prevent Direct URL Access without SPA -->
<script>
    if (!document.getElementById("dynamicWorkspace") || window.location.pathname.endsWith("ta_transfer.html")) {
        window.location.href = "index.html";
    }
</script>

<div id="moduleRenderArea">
    
    <!-- 100% SELF-CONTAINED PERFECT DESIGN CSS -->
    <style>
        .portal-page-panel { max-width: 1200px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Typography & Layout */
        h3.module-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .back-nav-link { display: inline-flex; align-items: center; color: #3b82f6; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; transition: color 0.2s; padding: 8px 15px; background: #eff6ff; border-radius: 8px; float: right; }
        .back-nav-link:hover { color: #1d4ed8; background: #dbeafe; }
        
        .form-group { margin-bottom: 20px; clear: both; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: #334155; }
        
        /* Inputs & Textareas */
        input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 14px 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; background: #f8fafc; color: #1e293b !important; transition: all 0.2s ease; font-family: 'Segoe UI', Arial, sans-serif; }
        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: #4f46e5; background: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); outline: none; }
        
        /* NORMAL (NON-ITALIC) PLACEHOLDERS */
        input::placeholder, textarea::placeholder { color: #94a3b8 !important; font-style: normal !important; opacity: 1 !important; }
        
        textarea { resize: vertical; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; }
        
        /* Family Table Styling */
        .ta-family-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; }
        .ta-family-table th, .ta-family-table td { padding: 12px; border-bottom: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; }
        .ta-family-table th:last-child, .ta-family-table td:last-child { border-right: none; }
        .ta-family-table th { background: #f1f5f9; font-size: 13.5px; color: #334155; text-align: left; font-weight: 800; }
        .ta-family-table input { padding: 10px; border: 1px solid #e2e8f0; background: #ffffff; width: 100%; box-sizing: border-box; border-radius: 6px; }
        .ta-family-table input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        /* Action Button */
        button.action-btn { width: 100%; padding: 16px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 15.5px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 15px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button.action-btn:hover { background: #4338ca; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(67, 56, 202, 0.3); }

        /* --- PERFECT CENTERED MODAL, FULL SCREEN BLUR --- */
        .pdf-modal-overlay {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            background: rgba(241, 245, 249, 0.85) !important; 
            backdrop-filter: blur(8px) !important;
            z-index: 99999999 !important; 
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .pdf-modal-overlay.active { display: flex; opacity: 1; }
        
        .pdf-modal-card {
            background: #ffffff; width: 85%; max-width: 900px; height: 85vh;
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid #cbd5e1; border-top: 6px solid #4f46e5;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }
        .pdf-modal-overlay.active .pdf-modal-card { transform: scale(1); }
        
        .pdf-modal-header { padding: 15px 25px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .pdf-modal-header h3 { margin: 0; color: #1e293b; font-size: 18px; font-weight: 800; font-family: 'Segoe UI', Arial, sans-serif; }
        .pdf-close-btn { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pdf-close-btn:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);}
        .pdf-iframe-container { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }
        #pdfFrameViewerLocal { width: 100%; height: 100%; border: none; display: block; }
    </style>

    <div class='portal-page-panel' style='display:block;'>
        
        <div style="margin-bottom: 35px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; overflow: hidden;">
            <div class='back-nav-link' onclick='typeof returnToHomeGridSPA === "function" ? returnToHomeGridSPA() : (window.location.href="index.html")'>⬅️ Back to Dashboard</div>
            <h3 class="module-title">Module: Application for Advance of T.A. on Transfer</h3>
        </div>
        
        <div class='flex-row'>
            <div class='form-group'>
                <label>1. Name of the Officer/ Official:</label>
                <input class='text-input-placeholder-gray' id='tatName' placeholder='e.g. Subhajit Parbat' type='text'/>
            </div>
            <div class='form-group'>
                <label>2. Designation:</label>
                <input class='text-input-placeholder-gray' id='tatDesignation' placeholder='e.g. MTS / Postal Assistant' type='text'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>3. Whether temporary / permanent:</label>
                <select id='tatPermTemp'>
                    <option value='Permanent'>Permanent</option>
                    <option value='Temporary'>Temporary</option>
                </select>
            </div>
            <div class='form-group'>
                <label>4. Office/Station in which working:</label>
                <input class='text-input-placeholder-gray' id='tatOffice' placeholder='e.g. Radhakishorepur HO' type='text'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>5. Basic Pay + NPA + SI:</label>
                <input class='text-input-placeholder-gray' id='tatPay' placeholder='e.g. 25500' type='text'/>
            </div>
            <div class='form-group'>
                <label>6. Station to which transferred:</label>
                <input class='text-input-placeholder-gray' id='tatStationTransferred' placeholder='e.g. Agartala HO' type='text'/>
            </div>
        </div>
        <div class='form-group'>
            <label>7. No. & Date of the transfer order:</label>
            <input class='text-input-placeholder-gray' id='tatOrderNo' placeholder='e.g. Memo No. Est/1-2/2026 dated 10/05/2026' type='text'/>
        </div>
        
        <div style='background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-bottom: 20px;'>
            <h4 style='margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;'>8. Details of family members</h4>
            <table class='ta-family-table'>
                <thead>
                    <tr>
                        <th style="width: 50%;">Family Particulars (Name)</th>
                        <th style="width: 20%;">Age</th>
                        <th style="width: 30%;">Relationship</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td><input class="text-input-placeholder-gray" id='tatFamName1' placeholder='Name 1' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamAge1' placeholder='Age' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamRel1' placeholder='Relation' type='text'/></td></tr>
                    <tr><td><input class="text-input-placeholder-gray" id='tatFamName2' placeholder='Name 2' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamAge2' placeholder='Age' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamRel2' placeholder='Relation' type='text'/></td></tr>
                    <tr><td><input class="text-input-placeholder-gray" id='tatFamName3' placeholder='Name 3' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamAge3' placeholder='Age' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamRel3' placeholder='Relation' type='text'/></td></tr>
                    <tr><td><input class="text-input-placeholder-gray" id='tatFamName4' placeholder='Name 4' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamAge4' placeholder='Age' type='text'/></td><td><input class="text-input-placeholder-gray" id='tatFamRel4' placeholder='Relation' type='text'/></td></tr>
                </tbody>
            </table>
        </div>
        
        <div class='flex-row'>
            <div class='form-group'>
                <label>9. Advance required for:</label>
                <select id='tatAdvanceFor'>
                    <option value='Self alone'>Self alone</option>
                    <option value='Self and family'>Self and family</option>
                    <option value='Family alone'>Family alone</option>
                </select>
            </div>
            <div class='form-group'>
                <label>10. Amount of advance required (Rs.):</label>
                <input class='text-input-placeholder-gray' id='tatAdvanceReq' placeholder='e.g. 5000' type='number'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>Station:</label>
                <input class='text-input-placeholder-gray' id='tatStation' placeholder='e.g. Radhakishorepur' type='text'/>
            </div>
            <div class='form-group'>
                <label>Date:</label>
                <input id='tatDate' type='date'/>
            </div>
        </div>
        
        <button class='action-btn' onclick='triggerSmartGenerationTATransfer()' type='button'>Generate T.A. Transfer PDF</button>
    </div>

    <!-- BEAUTIFUL CENTERED POPUP MODAL FOR PDF PREVIEW -->
    <div id="pdfModalOverlay" class="pdf-modal-overlay">
        <div class="pdf-modal-card">
            <div class="pdf-modal-header">
                <h3>📄 Generated Document Live Preview</h3>
                <button class="pdf-close-btn" onclick="closePdfModal()">❌ Close Preview</button>
            </div>
            <div class="pdf-iframe-container">
                <iframe id="pdfFrameViewerLocal"></iframe>
            </div>
        </div>
    </div>

    <!-- 100% UNTOUCHED ORIGINAL PDF LOGIC (Adapted for T.A. Advance on Transfer) -->
    <script>
        // Ensure jsPDF loads if standalone
        if (typeof window.jspdf === 'undefined') {
            let script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            document.head.appendChild(script);
        }

        const LOCAL_INDIA_POST_LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXlVwmm2OUFIPv_sRjEtehJrDPqIS-nbUCLNZU8i4LT-O-V14Wp6hpQGw&s=10";

        function closePdfModal() {
            const overlay = document.getElementById('pdfModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function finalizeLocalViewer(doc) {
            const blobDataUrl = doc.output('datauristring');
            const iframe = document.getElementById('pdfFrameViewerLocal');
            const overlay = document.getElementById('pdfModalOverlay');
            
            // Move overlay to body to cover whole screen perfectly
            if (overlay.parentNode !== document.body) {
                document.body.appendChild(overlay);
            }

            iframe.src = blobDataUrl;
            
            // Show the modal perfectly centered!
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.classList.add('active'); }, 50);
        }

        function triggerSmartGenerationTATransfer() {
            if (!document.getElementById('tatName').value) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: Name of the Officer/Official is mandatory.");
                } else {
                    alert("Form Defect: Name of the Officer/Official is mandatory.");
                }
                return; 
            }

            const loader = document.getElementById('globalAppLoader');
            if(loader) {
                loader.style.display = 'flex';
                document.querySelector('.loading-status-msg').innerText = "Processing T.A. Transfer Document...";
            }

            setTimeout(() => {
                try {
                    if (typeof window.jspdf === 'undefined') {
                        alert("System Notice: Please wait a moment for the PDF engine to load, then click generate again.");
                        if(loader) loader.style.display = 'none';
                        return;
                    }

                    // --- EXACT ORIGINAL PDF GENERATION LOGIC ---
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');

                    const name = document.getElementById('tatName').value || "";
                    const desig = document.getElementById('tatDesignation').value || "";
                    const permTemp = document.getElementById('tatPermTemp').value || "";
                    const office = document.getElementById('tatOffice').value || "";
                    const pay = document.getElementById('tatPay').value || "";
                    const stationTransferred = document.getElementById('tatStationTransferred').value || "";
                    const orderNo = document.getElementById('tatOrderNo').value || "";
                    const advanceFor = document.getElementById('tatAdvanceFor').value || "";
                    const advanceReq = document.getElementById('tatAdvanceReq').value || "";
                    const station = document.getElementById('tatStation').value || "";
                    
                    let rawDate = document.getElementById('tatDate').value;
                    let formattedDate = "";
                    if (rawDate) {
                        let p = rawDate.split("-");
                        formattedDate = p[2] + "/" + p[1] + "/" + p[0];
                    }

                    doc.setFont("times", "bold");
                    doc.setFontSize(14);
                    doc.text("APPLICATION FOR ADVANCE OF T.A. ON", 105, 20, { align: "center" });
                    doc.text("TRANSFER", 105, 26, { align: "center" });

                    try {
                        doc.addImage(LOCAL_INDIA_POST_LOGO_URL, 'PNG', 165, 10, 20, 20);
                    } catch (err) {
                        console.error("Logo error:", err);
                    }

                    doc.setFontSize(10);
                    let currentY = 35;
                    
                    const drawRow = (sno, label, val, h) => {
                        doc.setFont("times", "bold");
                        doc.text(sno, 20, currentY + (h/2) + 1.5, { align: "center" });
                        
                        doc.setFont("times", "bold");
                        let splitLabel = doc.splitTextToSize(label, 80);
                        doc.text(splitLabel, 27, currentY + 6);
                        
                        doc.setFont("times", "normal");
                        let splitVal = doc.splitTextToSize(val, 80);
                        doc.text(splitVal, 112, currentY + 6);
                        
                        currentY += h;
                        doc.line(15, currentY, 195, currentY); 
                    };

                    doc.line(15, currentY, 195, currentY); 

                    drawRow("1.", "Name of the Officer/ Official.", name, 10);
                    drawRow("2.", "Designation.", desig, 10);
                    drawRow("3.", "Whether temporary / permanent.", permTemp, 10);
                    drawRow("4.", "Office/Station in which working.", office, 10);
                    drawRow("5.", "Basic Pay + NPA + SI.", pay, 10);
                    drawRow("6.", "Station to which transferred.", stationTransferred, 10);
                    drawRow("7.", "No. & Date of the transfer order.", orderNo, 10);

                    let r8StartY = currentY;
                    doc.setFont("times", "bold");
                    doc.text("8.", 20, currentY + 6, { align: "center" });
                    doc.text("Details of family members alongwith\ntheir age and relationship.", 27, currentY + 5);
                    currentY += 12;
                    doc.line(25, currentY, 195, currentY);
                    
                    doc.text("Family Particulars", 67, currentY + 5.5, { align: "center" });
                    doc.text("Age", 127, currentY + 5.5, { align: "center" });
                    doc.text("Relationship", 170, currentY + 5.5, { align: "center" });
                    currentY += 8;
                    doc.line(25, currentY, 195, currentY);

                    doc.setFont("times", "normal");
                    for(let i=1; i<=4; i++) {
                        let fName = document.getElementById('tatFamName' + i).value || "";
                        let fAge = document.getElementById('tatFamAge' + i).value || "";
                        let fRel = document.getElementById('tatFamRel' + i).value || "";
                        
                        doc.text(fName, 27, currentY + 5.5);
                        doc.text(fAge, 127, currentY + 5.5, { align: "center" });
                        doc.text(fRel, 170, currentY + 5.5, { align: "center" });
                        
                        currentY += 8;
                        doc.line(25, currentY, 195, currentY);
                    }

                    doc.setFont("times", "bold");
                    doc.text("9.", 20, currentY + 5.5, { align: "center" });
                    doc.text("Whether the advance is required for.", 27, currentY + 5.5);
                    currentY += 8;
                    doc.line(15, currentY, 195, currentY); 
                    
                    const checkA = advanceFor === 'Self alone' ? 'Yes' : '';
                    const checkB = advanceFor === 'Self and family' ? 'Yes' : '';
                    const checkC = advanceFor === 'Family alone' ? 'Yes' : '';

                    let r9aStartY = currentY;
                    doc.setFont("times", "bold");
                    doc.text("(a)", 31, currentY + 5.5, { align: "center" });
                    doc.text("Self alone, or", 40, currentY + 5.5);
                    doc.setFont("times", "normal");
                    doc.text(checkA, 112, currentY + 5.5);
                    currentY += 8;
                    doc.line(25, currentY, 195, currentY);

                    doc.setFont("times", "bold");
                    doc.text("(b)", 31, currentY + 5.5, { align: "center" });
                    doc.text("Self and family, or", 40, currentY + 5.5);
                    doc.setFont("times", "normal");
                    doc.text(checkB, 112, currentY + 5.5);
                    currentY += 8;
                    doc.line(25, currentY, 195, currentY);

                    doc.setFont("times", "bold");
                    doc.text("(c)", 31, currentY + 5.5, { align: "center" });
                    doc.text("Family alone", 40, currentY + 5.5);
                    doc.setFont("times", "normal");
                    doc.text(checkC, 112, currentY + 5.5);
                    currentY += 8;
                    doc.line(15, currentY, 195, currentY);

                    drawRow("10.", "Amount of advance required", advanceReq ? "Rs. " + advanceReq : "", 10);

                    doc.line(15, 35, 15, currentY); 
                    doc.line(25, 35, 25, currentY); 
                    doc.line(110, 35, 110, currentY); 
                    doc.line(195, 35, 195, currentY); 

                    doc.line(145, r8StartY + 12, 145, r8StartY + 12 + 8 + 32); 
                    
                    doc.line(38, r9aStartY, 38, r9aStartY + 24); 

                    currentY += 15;
                    doc.setFont("times", "bold");
                    doc.text("I declare that the particulars furnished above are correct.", 105, currentY, { align: "center" });

                    currentY += 25;
                    doc.text("Station :", 15, currentY);
                    doc.setFont("times", "normal");
                    doc.text(station, 32, currentY);
                    
                    currentY += 10;
                    doc.setFont("times", "bold");
                    doc.text("Date :", 15, currentY);
                    doc.setFont("times", "normal");
                    doc.text(formattedDate, 26, currentY);
                    
                    doc.setFont("times", "bold");
                    doc.text("Signature of the Government Servant.", 195, currentY - 5, { align: "right" });
                    
                    doc.text("- t r j -", 185, 285, { align: "right" }); 

                    // Send to the centered modal preview
                    finalizeLocalViewer(doc);

                } catch (err) {
                    console.error("PDF generation failure: ", err); 
                    if(typeof displayCustomAlert === "function") {
                        displayCustomAlert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    } else {
                        alert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    }
                } finally {
                    if(loader) loader.style.display = 'none';
                }
            }, 750);
        }
    </script>
</div>
