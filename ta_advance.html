<!-- ta_advance.html -->
<!-- Security Check: Prevent Direct URL Access without SPA -->
<script>
    if (!document.getElementById("dynamicWorkspace") || window.location.pathname.endsWith("ta_advance.html")) {
        window.location.href = "index.html";
    }
</script>

<div id="moduleRenderArea">
    
    <!-- 100% SELF-CONTAINED PERFECT DESIGN CSS -->
    <style>
        .portal-page-panel { max-width: 1200px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Typography & Layout */
        h3.module-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .back-nav-link { display: inline-flex; align-items: center; color: #3b82f6; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; transition: color 0.2s; padding: 8px 15px; background: #eff6ff; border-radius: 8px; float: right; }
        .back-nav-link:hover { color: #1d4ed8; background: #dbeafe; }
        
        .form-group { margin-bottom: 20px; clear: both; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: #334155; }
        
        /* Inputs & Textareas */
        input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 14px 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; background: #f8fafc; color: #1e293b !important; transition: all 0.2s ease; font-family: 'Segoe UI', Arial, sans-serif; }
        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: #e11d48; background: #ffffff; box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.1); outline: none; }
        
        /* NORMAL (NON-ITALIC) PLACEHOLDERS */
        input::placeholder, textarea::placeholder { color: #94a3b8 !important; font-style: normal !important; opacity: 1 !important; }
        
        textarea { resize: vertical; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; }
        
        /* Action Button */
        button.action-btn { width: 100%; padding: 16px; background: #e11d48; color: white; border: none; border-radius: 8px; font-size: 15.5px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 15px; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button.action-btn:hover { background: #be123c; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(190, 18, 60, 0.3); }

        /* --- PERFECT CENTERED MODAL, FULL SCREEN BLUR --- */
        .pdf-modal-overlay {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            background: rgba(241, 245, 249, 0.85) !important; 
            backdrop-filter: blur(8px) !important;
            z-index: 99999999 !important; 
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .pdf-modal-overlay.active { display: flex; opacity: 1; }
        
        .pdf-modal-card {
            background: #ffffff; width: 85%; max-width: 900px; height: 85vh;
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid #cbd5e1; border-top: 6px solid #e11d48;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }
        .pdf-modal-overlay.active .pdf-modal-card { transform: scale(1); }
        
        .pdf-modal-header { padding: 15px 25px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .pdf-modal-header h3 { margin: 0; color: #1e293b; font-size: 18px; font-weight: 800; font-family: 'Segoe UI', Arial, sans-serif; }
        .pdf-close-btn { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pdf-close-btn:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);}
        .pdf-iframe-container { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }
        #pdfFrameViewerLocal { width: 100%; height: 100%; border: none; display: block; }
    </style>

    <div class='portal-page-panel' style='display:block;'>
        
        <div style="margin-bottom: 35px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; overflow: hidden;">
            <div class='back-nav-link' onclick='typeof returnToHomeGridSPA === "function" ? returnToHomeGridSPA() : (window.location.href="index.html")'>⬅️ Back to Dashboard</div>
            <h3 class="module-title">Module: Application for Advance of T.A. on Tour</h3>
        </div>
        
        <div class='flex-row'>
            <div class='form-group'>
                <label>1. Name of the Officer/ Official:</label>
                <input class='text-input-placeholder-gray' id='taName' placeholder='e.g. Subhajit Parbat' type='text'/>
            </div>
            <div class='form-group'>
                <label>2. Designation:</label>
                <input class='text-input-placeholder-gray' id='taDesignation' placeholder='e.g. MTS / Postal Assistant' type='text'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>3. Permanent / Temporary:</label>
                <select id='taPermTemp'>
                    <option value='Permanent'>Permanent</option>
                    <option value='Temporary'>Temporary</option>
                </select>
            </div>
            <div class='form-group'>
                <label>4. Office/Section in which working:</label>
                <input class='text-input-placeholder-gray' id='taOffice' placeholder='e.g. Radhakishorepur HO' type='text'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>5. Basic Pay + NPA + SI:</label>
                <input class='text-input-placeholder-gray' id='taPay' placeholder='e.g. 25500' type='text'/>
            </div>
            <div class='form-group'>
                <label>9. Duration of journey (in days):</label>
                <input class='text-input-placeholder-gray' id='taDuration' placeholder='e.g. 2' type='number'/>
            </div>
        </div>
        <div class='form-group'>
            <label>6. Places to be visited and period of halt at each station:</label>
            <textarea class='text-input-placeholder-gray' id='taPlaces' placeholder='e.g. Agartala (1 day halt)' rows='2'></textarea>
        </div>
        <div class='form-group'>
            <label>7. Purpose of tour:</label>
            <textarea class='text-input-placeholder-gray' id='taPurpose' placeholder='e.g. Official Meeting / Inspection' rows='2'></textarea>
        </div>
        <div class='form-group'>
            <label>8. Has the tour programme been approved?</label>
            <select id='taApproved'>
                <option value='Yes'>Yes</option>
                <option value='No'>No</option>
            </select>
        </div>
        <div class='form-group'>
            <label>10. Rail/Road fare by the entitled class...</label>
            <textarea class='text-input-placeholder-gray' id='taFare' placeholder='Describe mode of travel and estimated fare. e.g. Bus fare Rs. 200' rows='2'></textarea>
        </div>
        
        <div style='background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-bottom: 20px;'>
            <h4 style='margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;'>11. Daily Allowance Entitled (Rs.)</h4>
            <div class='flex-row'>
                <div class='form-group'>
                    <label>(i) For journey period:</label>
                    <input class='text-input-placeholder-gray' id='taDaJourney' oninput='calculateTATotalsLocal()' placeholder='e.g. 500' type='number'/>
                </div>
                <div class='form-group'>
                    <label>(ii) For the halts:</label>
                    <input class='text-input-placeholder-gray' id='taDaHalts' oninput='calculateTATotalsLocal()' placeholder='e.g. 800' type='number'/>
                </div>
                <div class='form-group'>
                    <label>Total D.A. (i + ii):</label>
                    <input class='text-input-placeholder-gray' id='taDaTotal' placeholder='Auto-calculated' readonly='readonly' style='background:#e2e8f0; font-weight: bold; color: #0f172a;' type='number'/>
                </div>
            </div>
        </div>
        
        <div class='flex-row'>
            <div class='form-group'>
                <label>12. Total T.A. + D.A. (10 + 11):</label>
                <input class='text-input-placeholder-gray' id='taTotalTADA' placeholder='Enter combined total (Rs.) e.g. 1500' type='number'/>
            </div>
            <div class='form-group'>
                <label>13. Amount of Advance required:</label>
                <input class='text-input-placeholder-gray' id='taAdvanceReq' placeholder='Enter required advance (Rs.)' type='number'/>
            </div>
        </div>
        <div class='form-group'>
            <label>14. Whether any earlier advance is outstanding:</label>
            <textarea class='text-input-placeholder-gray' id='taOutstanding' placeholder='e.g. Nil' rows='2'></textarea>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>Station:</label>
                <input class='text-input-placeholder-gray' id='taStation' placeholder='e.g. Radhakishorepur HO' type='text'/>
            </div>
            <div class='form-group'>
                <label>Date:</label>
                <input id='taDate' type='date'/>
            </div>
        </div>
        
        <button class='action-btn' onclick='triggerSmartGenerationTAAdvance()' type='button'>Generate T.A. Advance PDF</button>
    </div>

    <!-- BEAUTIFUL CENTERED POPUP MODAL FOR PDF PREVIEW -->
    <div id="pdfModalOverlay" class="pdf-modal-overlay">
        <div class="pdf-modal-card">
            <div class="pdf-modal-header">
                <h3>📄 Generated Document Live Preview</h3>
                <button class="pdf-close-btn" onclick="closePdfModal()">❌ Close Preview</button>
            </div>
            <div class="pdf-iframe-container">
                <iframe id="pdfFrameViewerLocal"></iframe>
            </div>
        </div>
    </div>

    <!-- 100% UNTOUCHED ORIGINAL PDF LOGIC (Adapted for T.A. Tour Advance) -->
    <script>
        // Ensure jsPDF loads if standalone
        if (typeof window.jspdf === 'undefined') {
            let script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            document.head.appendChild(script);
        }

        const LOCAL_INDIA_POST_LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXlVwmm2OUFIPv_sRjEtehJrDPqIS-nbUCLNZU8i4LT-O-V14Wp6hpQGw&s=10";

        // Auto calculate DA Totals
        function calculateTATotalsLocal() {
            let j = parseFloat(document.getElementById('taDaJourney').value) || 0;
            let h = parseFloat(document.getElementById('taDaHalts').value) || 0;
            document.getElementById('taDaTotal').value = (j + h);
        }

        function closePdfModal() {
            const overlay = document.getElementById('pdfModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function finalizeLocalViewer(doc) {
            const blobDataUrl = doc.output('datauristring');
            const iframe = document.getElementById('pdfFrameViewerLocal');
            const overlay = document.getElementById('pdfModalOverlay');
            
            // Move overlay to body to cover whole screen perfectly
            if (overlay.parentNode !== document.body) {
                document.body.appendChild(overlay);
            }

            iframe.src = blobDataUrl;
            
            // Show the modal perfectly centered!
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.classList.add('active'); }, 50);
        }

        function triggerSmartGenerationTAAdvance() {
            if (!document.getElementById('taName').value) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: Name of the Officer/Official is mandatory.");
                } else {
                    alert("Form Defect: Name of the Officer/Official is mandatory.");
                }
                return; 
            }

            const loader = document.getElementById('globalAppLoader');
            if(loader) {
                loader.style.display = 'flex';
                document.querySelector('.loading-status-msg').innerText = "Processing T.A. Advance Document...";
            }

            setTimeout(() => {
                try {
                    if (typeof window.jspdf === 'undefined') {
                        alert("System Notice: Please wait a moment for the PDF engine to load, then click generate again.");
                        if(loader) loader.style.display = 'none';
                        return;
                    }

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');

                    const name = document.getElementById('taName').value || "";
                    const desig = document.getElementById('taDesignation').value || "";
                    const permTemp = document.getElementById('taPermTemp').value || "";
                    const office = document.getElementById('taOffice').value || "";
                    const pay = document.getElementById('taPay').value || "";
                    const places = document.getElementById('taPlaces').value || "";
                    const purpose = document.getElementById('taPurpose').value || "";
                    const approved = document.getElementById('taApproved').value || "";
                    const duration = document.getElementById('taDuration').value || "";
                    const fare = document.getElementById('taFare').value || "";
                    const daJourney = document.getElementById('taDaJourney').value || "";
                    const daHalts = document.getElementById('taDaHalts').value || "";
                    const daTotal = document.getElementById('taDaTotal').value || "";
                    const totalTADA = document.getElementById('taTotalTADA').value || "";
                    const advanceReq = document.getElementById('taAdvanceReq').value || "";
                    const outstanding = document.getElementById('taOutstanding').value || "";
                    const station = document.getElementById('taStation').value || "";
                    
                    let rawDate = document.getElementById('taDate').value;
                    let formattedDate = "";
                    if (rawDate) {
                        let p = rawDate.split("-");
                        formattedDate = p[2] + "/" + p[1] + "/" + p[0];
                    }

                    doc.setFont("times", "bold");
                    doc.setFontSize(14);
                    doc.text("APPLICATION FOR ADVANCE OF T.A. ON TOUR", 105, 25, { align: "center" });

                    try {
                        doc.addImage(LOCAL_INDIA_POST_LOGO_URL, 'PNG', 165, 10, 20, 20);
                    } catch (err) {
                        console.error("Logo error:", err);
                    }

                    doc.setFontSize(10);
                    let currentY = 40;
                    
                    const drawRow = (sno, label, val, h, isBoldLabel = true) => {
                        doc.setFont("times", "bold");
                        doc.text(sno, 20, currentY + (h/2) + 1.5, { align: "center" });
                        
                        if (isBoldLabel) doc.setFont("times", "bold");
                        else doc.setFont("times", "normal");
                        
                        let splitLabel = doc.splitTextToSize(label, 80);
                        doc.text(splitLabel, 27, currentY + 6);
                        
                        doc.setFont("times", "normal");
                        let splitVal = doc.splitTextToSize(val, 80);
                        doc.text(splitVal, 112, currentY + 6);
                        
                        currentY += h;
                        doc.line(15, currentY, 195, currentY); 
                    };

                    doc.line(15, currentY, 195, currentY); 

                    drawRow("1.", "Name of the Officer/ Official.", name, 10);
                    drawRow("2.", "Designation.", desig, 10);
                    drawRow("3.", "Whether permanent / temporary.", permTemp, 10);
                    drawRow("4.", "Office/Section in which working.", office, 10);
                    drawRow("5.", "Basic Pay + NPA + SI.", pay, 10);
                    drawRow("6.", "Places to be visited and period of halt\nat each station.", places, 14);
                    drawRow("7.", "Purpose of tour.", purpose, 10);
                    drawRow("8.", "Has the tour programme been\napproved by competent authority ?", approved, 14);
                    drawRow("9.", "Duration of journey (in days).", duration, 10);
                    drawRow("10.", "Rail/Road fare by the entitled class by\nwhich the Government Servant\nproposes to travel for both outward\nand inward journeys.", fare, 18);

                    let r11StartY = currentY;
                    doc.setFont("times", "bold");
                    doc.text("11.", 20, currentY + 6, { align: "center" });
                    doc.text("Daily allowance entitled -", 27, currentY + 6);
                    currentY += 10;
                    doc.line(25, currentY, 195, currentY);
                    
                    doc.text("(i)", 30, currentY + 6, { align: "center" });
                    doc.text("For journey period", 36, currentY + 6);
                    doc.setFont("times", "normal");
                    doc.text(daJourney ? "Rs. " + daJourney : "", 112, currentY + 6);
                    currentY += 10;
                    doc.line(25, currentY, 195, currentY);
                    
                    doc.setFont("times", "bold");
                    doc.text("(ii)", 30, currentY + 6, { align: "center" });
                    doc.text("For the halts", 36, currentY + 6);
                    doc.setFont("times", "normal");
                    doc.text(daHalts ? "Rs. " + daHalts : "", 112, currentY + 6);
                    currentY += 10;
                    doc.line(25, currentY, 195, currentY);
                    
                    doc.setFont("times", "bold");
                    doc.text("Total", 65, currentY + 6, { align: "center" });
                    doc.setFont("times", "normal");
                    doc.text(daTotal ? "Rs. " + daTotal : "", 112, currentY + 6);
                    currentY += 10;
                    doc.line(15, currentY, 195, currentY); 

                    doc.line(34, r11StartY + 10, 34, currentY - 10); 

                    drawRow("12.", "Total T.A. + D.A. ( 10 + 11)", totalTADA, 10);
                    drawRow("13.", "Amount of Advance required", advanceReq, 10);
                    drawRow("14.", "Whether any earlier advance is\noutstanding. If so, the date on which\nT.A. bill was submitted.", outstanding, 16);

                    doc.line(15, 40, 15, currentY); 
                    doc.line(25, 40, 25, currentY); 
                    doc.line(110, 40, 110, currentY); 
                    doc.line(195, 40, 195, currentY); 

                    currentY += 15;
                    doc.setFont("times", "bold");
                    doc.text("I declare that the particulars furnished above are correct.", 105, currentY, { align: "center" });

                    currentY += 25;
                    doc.text("Station :", 15, currentY);
                    doc.setFont("times", "normal");
                    doc.text(station, 32, currentY);
                    
                    currentY += 10;
                    doc.setFont("times", "bold");
                    doc.text("Date :", 15, currentY);
                    doc.setFont("times", "normal");
                    doc.text(formattedDate, 26, currentY);
                    
                    doc.setFont("times", "bold");
                    doc.text("Signature of the Government Servant.", 195, currentY - 5, { align: "right" });
                    
                    doc.text("- t r j -", 185, 285, { align: "right" }); 

                    // Send to the centered modal preview
                    finalizeLocalViewer(doc);

                } catch (err) {
                    console.error("PDF generation failure: ", err); 
                    if(typeof displayCustomAlert === "function") {
                        displayCustomAlert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    } else {
                        alert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    }
                } finally {
                    if(loader) loader.style.display = 'none';
                }
            }, 750);
        }
    </script>
</div>
