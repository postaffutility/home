<!-- req-rejection.html (Request Rejection Report Module) -->
<script>
    if (!document.getElementById("dynamicWorkspace") || window.location.pathname.endsWith("req-rejection.html")) {
        window.location.href = "index.html";
    }
</script>

<div id="moduleRenderArea">
    
    <!-- External Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        .sp-page-panel { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; animation: spFadeIn 0.3s ease-out forwards; }
        
        .sp-module-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .sp-back-nav { display: inline-flex; align-items: center; color: #3b82f6; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; transition: color 0.2s; padding: 8px 16px; background: #eff6ff; border-radius: 8px; float: right; border: 1px solid #bfdbfe; }
        .sp-back-nav:hover { color: #1d4ed8; background: #dbeafe; transform: translateX(-2px); }

        .sp-form-group { margin-bottom: 22px; text-align: left; }
        .sp-form-group label { display: block; font-weight: 800; margin-bottom: 10px; font-size: 14.5px; color: #334155; }
        
        .sp-input { width: 100%; padding: 16px 20px; box-sizing: border-box; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: #f8fafc; color: #1e293b !important; transition: all 0.3s ease; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; }
        .sp-input:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); outline: none;}
        .sp-input:disabled { background: #e2e8f0; color: #64748b !important; cursor: not-allowed; border-color: #cbd5e1; }
        
        select.sp-input { -webkit-appearance: none; -moz-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 18px center; background-size: 16px; padding-right: 50px; }
        select.sp-input:disabled { background-image: none; }
        
        .sp-action-btn { width: 100%; padding: 18px; color: white; border: none; border-radius: 12px; font-size: 15.5px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .sp-action-btn.blue { background: #3b82f6; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); }
        .sp-action-btn.blue:hover { background: #2563eb; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); }
        .sp-action-btn.red { background: #ef4444; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }
        .sp-action-btn.red:hover { background: #dc2626; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(220, 38, 38, 0.35); }
        .sp-action-btn.green { background: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
        .sp-action-btn.green:hover { background: #059669; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); }

        /* Floating Toast Notification CSS */
        .reqRej-toast-container { position: fixed; top: 30px; right: 30px; z-index: 100000000; display: flex; flex-direction: column; gap: 15px; pointer-events: none; }
        .reqRej-toast { background: #ffffff; border-left: 6px solid #3b82f6; box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 18px 25px; border-radius: 10px; font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 14px; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
        .reqRej-toast.show { transform: translateX(0); }
        .reqRej-toast.success { border-left-color: #10b981; }
        .reqRej-toast.error { border-left-color: #ef4444; }
        .reqRej-toast.warning { border-left-color: #f59e0b; }

        @keyframes spFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <div class='sp-page-panel' id="reqRejMainDashboard">
        <div style="margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; overflow: hidden;">
            <div class='sp-back-nav' onclick='typeof returnToHomeGridSPA === "function" ? returnToHomeGridSPA() : window.history.back()'>⬅️ Back to Reports</div>
            <h3 class="sp-module-title">❌ Request Rejection Report</h3>
            <p style="color: #64748b; font-size: 15px; margin-top: 8px; font-weight: 500;">Review all recently rejected requests, denied authorizations, and their workflow status.</p>
        </div>

        <div style="border-top: 4px solid #ef4444; background: #ffffff; border-radius: 16px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #e2e8f0;">
            
            <div style="background: #fff1f2; padding: 25px; border-radius: 12px; border: 1px solid #fecdd3; margin-bottom: 25px;">
                <p id="reqRejAccessNote" style="margin: 0 0 15px 0; font-size: 13.5px; color: #be123c; font-weight: 800;">Loading Access Rights...</p>
                
                <div class="sp-flex-row" style="align-items: flex-end;">
                    <!-- Dropdown Select -->
                    <div class="sp-form-group" style="flex: 1; margin-bottom: 0;">
                        <label style="color: #9f1239;">Quick Select (Dropdown)</label>
                        <select id="reqRejSolSelect" class="sp-input" style="border-color: #fda4af;" onchange="window.reqRejSyncSearchBox()"></select>
                    </div>
                    
                    <div style="font-weight: 900; color: #94a3b8; padding-bottom: 15px; text-align: center; width: 40px;">OR</div>
                    
                    <!-- Search Text Box -->
                    <div class="sp-form-group" style="flex: 1.5; margin-bottom: 0;">
                        <label style="color: #9f1239;">Search by SOL ID</label>
                        <div style="display: flex; gap: 10px;">
                            <input id="reqRejSearchId" type="text" class="sp-input" placeholder="Enter SOL ID or 'ALL'..." style="border-color: #fda4af; text-transform: uppercase;">
                            <button class="sp-action-btn red" style="margin-top: 0; width: auto; padding: 0 25px;" onclick="window.reqRejValidateData()">Validate</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Export Area (Hidden initially) -->
            <div id="reqRejExportContainer" style="display: none; animation: spFadeIn 0.3s ease-out; padding-top: 20px; border-top: 2px dashed #e2e8f0;">
                <h4 style="margin: 0 0 15px 0; color: #0f172a; font-size: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <span>📊 Data Validated Successfully</span>
                    <span id="reqRejRecordCount" style="background: #ffe4e6; color: #be123c; padding: 4px 12px; border-radius: 20px; font-size: 13px;">0 Requests Found</span>
                </h4>
                
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button class="sp-action-btn red" onclick="window.reqRejGeneratePDF()">📄 Preview PDF Report</button>
                    <button class="sp-action-btn green" onclick="window.reqRejGenerateExcel()">📊 Export to Excel</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =========================================================
        // FLOATING TOAST NOTIFICATION ENGINE
        // =========================================================
        window.reqRejShowToast = function(msg, type="success") {
            let container = document.getElementById('reqRejToastContainer');
            if(!container) {
                container = document.createElement('div');
                container.id = 'reqRejToastContainer';
                container.className = 'reqRej-toast-container';
                document.body.appendChild(container);
            }
            
            let toast = document.createElement('div');
            toast.className = `reqRej-toast ${type}`;
            let icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : '⚠️');
            toast.innerHTML = `<span style="font-size:22px;">${icon}</span> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        };

        // =========================================================
        // CORE LOGIC & VARIABLES
        // =========================================================
        window.reqRejData = {
            offices: [],
            requests: [],
            filteredData: [],
            selectedTarget: "",
            activeUser: sessionStorage.getItem("activeUser"),
            activeSolId: null // Dynamically fetched to prevent [null] bug
        };

        window.initReqRejReport = function() {
            let db = typeof firebase !== 'undefined' ? firebase.firestore() : null;
            if(!db) { window.reqRejShowToast("Database connection error.", "error"); return; }

            // Fetch live registry data
            db.collection("system").doc("registry").onSnapshot(doc => {
                if(doc.exists) {
                    let data = doc.data();
                    window.reqRejData.offices = data.offices || [];
                    window.reqRejData.requests = data.requests || [];
                    let users = data.users || [];
                    
                    // FIX: Dynamically assign active SOL ID to fix the [null] bug
                    if(window.reqRejData.activeUser === "admin") {
                        window.reqRejData.activeSolId = "000000";
                    } else {
                        let activeProfile = users.find(u => u.user === window.reqRejData.activeUser);
                        if(activeProfile) {
                            window.reqRejData.activeSolId = activeProfile.solId;
                        }
                    }
                    
                    window.reqRejPopulateSolDropdown();
                }
            });
        };

        window.reqRejPopulateSolDropdown = function() {
            let isHQ = (window.reqRejData.activeSolId === '000000' || window.reqRejData.activeUser === 'admin');
            let note = document.getElementById('reqRejAccessNote');
            let sel = document.getElementById('reqRejSolSelect');
            let searchInp = document.getElementById('reqRejSearchId');
            
            sel.innerHTML = ""; // Clear existing

            if(isHQ) {
                note.innerText = "HQ Access: You can generate rejection reports for ALL offices or select a specific SOL.";
                note.style.color = "#be123c"; 
                
                sel.innerHTML = `<option value="ALL">ALL (Entire Circle/Region)</option>`;
                window.reqRejData.offices.forEach(o => {
                    sel.innerHTML += `<option value="${o.solId}">${o.solId} - ${o.name}</option>`;
                });
                sel.disabled = false;
                searchInp.disabled = false;
            } else {
                let myOff = window.reqRejData.offices.find(o => o.solId === window.reqRejData.activeSolId);
                let offName = myOff ? myOff.name : "Unknown Office";
                
                note.innerText = `Branch Access: Report restricted to rejected requests initiated from your mapped SOL.`;
                note.style.color = "#be123c";
                
                sel.innerHTML = `<option value="${window.reqRejData.activeSolId}">${window.reqRejData.activeSolId} - ${offName}</option>`;
                sel.disabled = true; // Locked for Branch Admins
                searchInp.value = window.reqRejData.activeSolId;
                searchInp.disabled = true; // Lock text box for Branch Admins
            }
        };

        window.reqRejSyncSearchBox = function() {
            let selValue = document.getElementById('reqRejSolSelect').value;
            document.getElementById('reqRejSearchId').value = selValue;
            document.getElementById('reqRejExportContainer').style.display = 'none'; // Hide export until validated
        };

        window.reqRejValidateData = function() {
            let selectedSol = document.getElementById('reqRejSearchId').value.trim().toUpperCase();
            let container = document.getElementById('reqRejExportContainer');
            
            if(!selectedSol) {
                window.reqRejShowToast("Please enter or select a SOL ID.", "error");
                container.style.display = 'none';
                return;
            }

            let isHQ = (window.reqRejData.activeSolId === '000000' || window.reqRejData.activeUser === 'admin');

            // Verification Check for Branch Admins trying to search other SOLs manually
            if (!isHQ && selectedSol !== window.reqRejData.activeSolId && selectedSol !== "ALL") {
                window.reqRejShowToast("This SOL doesn't pertain to your jurisdiction.", "error");
                container.style.display = 'none';
                return;
            }
            if (!isHQ && selectedSol === "ALL") {
                window.reqRejShowToast("You do not have permission to generate 'ALL' reports.", "error");
                container.style.display = 'none';
                return;
            }

            // Verify if manually typed SOL actually exists in DB
            if (selectedSol !== "ALL" && !window.reqRejData.offices.some(o => o.solId === selectedSol)) {
                window.reqRejShowToast("The entered SOL ID does not exist in the system registry.", "error");
                container.style.display = 'none';
                return;
            }

            window.reqRejData.selectedTarget = selectedSol;
            
            // Filter Data (Omit the Master Admin Trace entirely AND ONLY GET REJECTED)
            let processedData = window.reqRejData.requests.filter(r => {
                if (r.requestedBy === 'admin') return false; // Hard-hide master admin trace
                if (r.status !== 'REJECTED') return false; // ONLY REJECTED
                
                if (selectedSol === "ALL") {
                    return true; 
                } else {
                    return r.solId === selectedSol;
                }
            });

            if(processedData.length === 0) {
                window.reqRejShowToast("No recent rejected requests found for the selected criteria.", "warning");
                container.style.display = 'none';
            } else {
                // Sort to show newest first
                window.reqRejData.filteredData = processedData.sort((a,b) => b.id.localeCompare(a.id));
                document.getElementById('reqRejRecordCount').innerText = `${processedData.length} Rejected Request(s) Found`;
                container.style.display = 'block';
                window.reqRejShowToast("Data validated successfully. Ready for export.", "success");
            }
        };

        // --- PDF GENERATION & PREVIEW LOGIC ---
        window.reqRejGeneratePDF = function() {
            if (window.reqRejData.filteredData.length === 0) return;
            const { jsPDF } = window.jspdf; 
            const doc = new jsPDF('l', 'mm', 'a4'); // Landscape for better fit of tables
            const pageWidth = doc.internal.pageSize.getWidth();

            let genName = sessionStorage.getItem("activeUser") === 'admin' ? "Master System Admin" : `@${window.reqRejData.activeUser}`;
            let genTime = new Date().toLocaleString("en-IN", {timeZone: "Asia/Kolkata"});

            // Premium Header (Center Aligned)
            doc.setFont("times", "bold"); 
            doc.setFontSize(22); 
            doc.setTextColor(37, 99, 235); // Blue Color for Title
            doc.text("PO STAFF UTILITY TOOL", pageWidth / 2, 20, { align: "center" });
            
            doc.setFont("times", "normal"); 
            doc.setFontSize(14); 
            doc.setTextColor(71, 85, 105); 
            doc.text("Daily Request Rejection & Status Report", pageWidth / 2, 28, { align: "center" });
            
            // Meta Info (Left Aligned)
            doc.setFontSize(10); 
            doc.setFont("helvetica", "normal"); 
            doc.setTextColor(15, 23, 42);
            doc.text(`Generated by: ${genName}`, 14, 40);
            doc.text(`Generated on (IST): ${genTime}`, 14, 45);

            let finalY = 55; 

            // Grouping Logic
            if (window.reqRejData.selectedTarget === "ALL") {
                let uniqueSols = [...new Set(window.reqRejData.filteredData.map(r => r.solId || "UNMAPPED"))].sort();

                uniqueSols.forEach(sol => {
                    let offDetails = window.reqRejData.offices.find(o => o.solId === sol);
                    let offName = offDetails ? offDetails.name : "Unknown Office";
                    
                    if (finalY > 170) { doc.addPage(); finalY = 20; } 
                    
                    doc.setFontSize(12);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(220, 38, 38); // Red color for SOL headers
                    doc.text(`Originating SOL: ${sol} - ${offName.toUpperCase()}`, 14, finalY);
                    finalY += 5;

                    let solReqs = window.reqRejData.filteredData.filter(r => (r.solId || "UNMAPPED") === sol);
                    
                    let tableData = solReqs.map((r, index) => [
                        index + 1, 
                        `#${r.id.substr(-5).toUpperCase()}`, 
                        r.type.replace(/_/g, ' '), 
                        `@${r.requestedBy}`, 
                        r.desc || "N/A",
                        r.status,
                        r.timestamp
                    ]);

                    doc.autoTable({ 
                        startY: finalY, 
                        head: [['#', 'Req ID', 'Request Type', 'Initiated By', 'Request Details', 'Current Status', 'Initiation Time']], 
                        body: tableData, 
                        theme: 'grid', 
                        headStyles: { fillColor: [220, 38, 38] }, // Red Header
                        styles: { fontSize: 9 }
                    }); 
                    
                    finalY = doc.lastAutoTable.finalY + 12; 
                });
            } else {
                // Single SOL
                let offDetails = window.reqRejData.offices.find(o => o.solId === window.reqRejData.selectedTarget);
                let offName = offDetails ? offDetails.name : "Unknown Office";

                doc.setFontSize(12);
                doc.setFont("helvetica", "bold");
                doc.setTextColor(220, 38, 38); 
                doc.text(`Originating SOL: ${window.reqRejData.selectedTarget} - ${offName.toUpperCase()}`, 14, finalY);
                finalY += 5;

                let tableData = window.reqRejData.filteredData.map((r, index) => [
                    index + 1, 
                    `#${r.id.substr(-5).toUpperCase()}`, 
                    r.type.replace(/_/g, ' '), 
                    `@${r.requestedBy}`, 
                    r.desc || "N/A",
                    r.status,
                    r.timestamp
                ]);

                doc.autoTable({ 
                    startY: finalY, 
                    head: [['#', 'Req ID', 'Request Type', 'Initiated By', 'Request Details', 'Current Status', 'Initiation Time']], 
                    body: tableData, 
                    theme: 'grid', 
                    headStyles: { fillColor: [220, 38, 38] }, // Red Header
                    styles: { fontSize: 9 }
                });
                finalY = doc.lastAutoTable.finalY + 15;
            }

            // Signature Section
            if (finalY > 180) { doc.addPage(); finalY = 30; } 
            doc.setFont("helvetica", "bold");
            doc.setTextColor(15, 23, 42);
            doc.text("Signature of the Official", pageWidth - 20, finalY + 15, { align: "right" });
            
            // PREVIEW MODE 
            window.open(doc.output('bloburl'), '_blank');
            window.reqRejShowToast("PDF Preview Generated Successfully!", "success");
        };

        // --- EXCEL GENERATION LOGIC ---
        window.reqRejGenerateExcel = function() {
            if (window.reqRejData.filteredData.length === 0) return;

            const excelData = window.reqRejData.filteredData.map(r => {
                let off = window.reqRejData.offices.find(o => o.solId === r.solId);
                return {
                    "Originating SOL ID": r.solId || "UNMAPPED",
                    "SOL Name": off ? off.name.toUpperCase() : "UNKNOWN",
                    "Request ID": `#${r.id.substr(-5).toUpperCase()}`,
                    "Request Type": r.type.replace(/_/g, ' '),
                    "Initiated By": `@${r.requestedBy}`,
                    "Request Details": r.desc || "N/A",
                    "Current Status": r.status,
                    "Initiation Time (IST)": r.timestamp,
                    "Resolved Time (If Any)": r.resolvedAtMs ? new Date(r.resolvedAtMs).toLocaleString('en-IN') : "Pending"
                };
            });

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new(); 
            XLSX.utils.book_append_sheet(wb, ws, "Request Rejection"); 
            
            let dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `Request_Rejection_Report_${dateStr}.xlsx`);
            window.reqRejShowToast("Excel Downloaded Successfully!", "success");
        };

        // Boot
        window.initReqRejReport();
    </script>
</div>
