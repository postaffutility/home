<!-- general_charge.html -->
<!-- Security Check: Prevent Direct URL Access without SPA -->
<script>
    if (!document.getElementById("dynamicWorkspace") || window.location.pathname.endsWith("general_charge.html")) {
        window.location.href = "index.html";
    }
</script>

<div id="moduleRenderArea">
    
    <!-- 100% SELF-CONTAINED PERFECT DESIGN CSS -->
    <style>
        .portal-page-panel { max-width: 1200px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Typography & Layout */
        h3.module-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .back-nav-link { display: inline-flex; align-items: center; color: #3b82f6; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; transition: color 0.2s; padding: 8px 15px; background: #eff6ff; border-radius: 8px; float: right; }
        .back-nav-link:hover { color: #1d4ed8; background: #dbeafe; }
        
        .form-group { margin-bottom: 20px; clear: both; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: #334155; }
        
        /* Inputs & Textareas */
        input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 14px 16px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14.5px; background: #f8fafc; color: #1e293b !important; transition: all 0.2s ease; font-family: 'Segoe UI', Arial, sans-serif; }
        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus, textarea:focus { border-color: #d32f2f; background: #ffffff; box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.1); outline: none; }
        
        /* NORMAL (NON-ITALIC) PLACEHOLDERS */
        input::placeholder, textarea::placeholder { color: #94a3b8 !important; font-style: normal !important; opacity: 1 !important; }
        
        textarea { resize: vertical; }
        .flex-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .flex-row > div { flex: 1; }
        .help-note { font-size: 12px; color: #64748b; margin-top: 6px; display: block; }
        
        /* Dynamic Row Container styling */
        .dynamic-date-row { display: flex; gap: 15px; background: #ffffff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 15px; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .delete-row-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .delete-row-btn:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
        .add-more-row-container { margin: 20px 0 30px 0; }
        .secondary-action-btn { background: #f1f5f9; color: #334155; padding: 12px 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 800; font-size: 13.5px; cursor: pointer; transition: all 0.2s; }
        .secondary-action-btn:hover { background: #e2e8f0; color: #0f172a; }

        /* Action Button */
        button.action-btn { width: 100%; padding: 16px; background: #475569; color: white; border: none; border-radius: 8px; font-size: 15.5px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 15px; box-shadow: 0 4px 12px rgba(71, 85, 105, 0.25); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button.action-btn:hover { background: #334155; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(51, 65, 85, 0.3); }

        /* --- PERFECT CENTERED MODAL, FULL SCREEN BLUR --- */
        .pdf-modal-overlay {
            position: fixed !important; top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            background: rgba(241, 245, 249, 0.85) !important; 
            backdrop-filter: blur(8px) !important;
            z-index: 99999999 !important; 
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .pdf-modal-overlay.active { display: flex; opacity: 1; }
        
        .pdf-modal-card {
            background: #ffffff; width: 85%; max-width: 900px; height: 85vh;
            border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            display: flex; flex-direction: column; overflow: hidden;
            border: 1px solid #cbd5e1; border-top: 6px solid #475569;
            transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: auto;
        }
        .pdf-modal-overlay.active .pdf-modal-card { transform: scale(1); }
        
        .pdf-modal-header { padding: 15px 25px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .pdf-modal-header h3 { margin: 0; color: #1e293b; font-size: 18px; font-weight: 800; font-family: 'Segoe UI', Arial, sans-serif; }
        .pdf-close-btn { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pdf-close-btn:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);}
        .pdf-iframe-container { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }
        #pdfFrameViewerLocal { width: 100%; height: 100%; border: none; display: block; }
    </style>

    <div class='portal-page-panel' style='display:block;'>
        
        <div style="margin-bottom: 35px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; overflow: hidden;">
            <div class='back-nav-link' onclick='typeof returnToHomeGridSPA === "function" ? returnToHomeGridSPA() : (window.location.href="index.html")'>⬅️ Back to Dashboard</div>
            <h3 class="module-title">Module: General Office Charge Report</h3>
        </div>
        
        <div class='form-group'>
            <label>Office Name / Post:</label>
            <input class='text-input-placeholder-gray' id='genOfficeName' placeholder='e.g. MTS, Radhakishorepur HO' type='text'/>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>Relieved Officer Name:</label>
                <input class='text-input-placeholder-gray' id='genRelievedOfficer' placeholder='Name of Officer Handing Over' type='text'/>
            </div>
            <div class='form-group'>
                <label>Relieving Officer Name:</label>
                <input class='text-input-placeholder-gray' id='genRelievingOfficer' placeholder='Name of Officer Taking Charge' type='text'/>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>Transfer Date:</label>
                <input id='genTransferDate' type='date'/>
            </div>
            <div class='form-group'>
                <label>Transfer Time:</label>
                <select id='genTransferTime'>
                    <option value='FN'>Forenoon (FN)</option>
                    <option value='AN'>Afternoon (AN)</option>
                </select>
            </div>
        </div>
        <div class='flex-row'>
            <div class='form-group'>
                <label>Memorandum / Letter No:</label>
                <input class='text-input-placeholder-gray' id='genMemoNo' placeholder='e.g. Est/1-2/2026' type='text'/>
            </div>
            <div class='form-group'>
                <label>Memorandum Date:</label>
                <input id='genMemoDate' type='date'/>
            </div>
        </div>
        <div class='form-group'>
            <label>From (Authority):</label>
            <input class='text-input-placeholder-gray' id='genFromAuthority' placeholder='e.g. SPOs, Divisional Office' type='text'/>
        </div>
        
        <div style='background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-bottom: 25px;'>
            <h4 style='margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;'>Copy Forwarded To Ledger</h4>
            <p style="font-size: 13px; color: #64748b; margin-top: -5px; margin-bottom: 15px;">Note: Generates 2 copies per page to save paper automatically.</p>
            <div id='genForwardContainer'></div>
            <div class='add-more-row-container' style='margin-bottom: 0;'>
                <button class='secondary-action-btn' onclick='addNewGenForwardRowLocal()' type='button'>+ Add Forwarded Officer</button>
            </div>
        </div>
        
        <button class='action-btn' onclick='triggerSmartGenerationGeneralCharge()' type='button'>Generate General Charge Report</button>
    </div>

    <!-- BEAUTIFUL CENTERED POPUP MODAL FOR PDF PREVIEW -->
    <div id="pdfModalOverlay" class="pdf-modal-overlay">
        <div class="pdf-modal-card">
            <div class="pdf-modal-header">
                <h3>📄 Generated Document Live Preview</h3>
                <button class="pdf-close-btn" onclick="closePdfModal()">❌ Close Preview</button>
            </div>
            <div class="pdf-iframe-container">
                <iframe id="pdfFrameViewerLocal"></iframe>
            </div>
        </div>
    </div>

    <!-- 100% UNTOUCHED ORIGINAL PDF LOGIC (Adapted for General Charge Report) -->
    <script>
        // Ensure jsPDF loads if standalone
        if (typeof window.jspdf === 'undefined') {
            let script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            document.head.appendChild(script);
        }

        // Add dynamic Forward Row Function for General Charge
        function addNewGenForwardRowLocal() {
            const container = document.getElementById('genForwardContainer'); 
            const newRow = document.createElement('div'); 
            newRow.className = 'dynamic-date-row'; 
            
            newRow.innerHTML = `
                <div style='flex: 1;'>
                    <input type='text' class='row-gen-forward-target text-input-placeholder-gray' placeholder='e.g. The Superintendent of Post Offices, Divisional Office' />
                </div>
                <div>
                    <button type='button' class='delete-row-btn' onclick='this.parentElement.parentElement.remove()'>❌</button>
                </div>
            `; 
            container.appendChild(newRow);
        }

        // Auto-add first row if empty
        setTimeout(() => {
            if(document.getElementById('genForwardContainer').children.length === 0) {
                addNewGenForwardRowLocal();
            }
        }, 100);

        function closePdfModal() {
            const overlay = document.getElementById('pdfModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function finalizeLocalViewer(doc) {
            const blobDataUrl = doc.output('datauristring');
            const iframe = document.getElementById('pdfFrameViewerLocal');
            const overlay = document.getElementById('pdfModalOverlay');
            
            // Move overlay to body to cover whole screen perfectly
            if (overlay.parentNode !== document.body) {
                document.body.appendChild(overlay);
            }

            iframe.src = blobDataUrl;
            
            // Show the modal perfectly centered!
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.classList.add('active'); }, 50);
        }

        function triggerSmartGenerationGeneralCharge() {
            if (!document.getElementById('genOfficeName').value || !document.getElementById('genRelievedOfficer').value || !document.getElementById('genRelievingOfficer').value) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: Office Name/Post, Relieved Officer, and Relieving Officer are mandatory.");
                } else {
                    alert("Form Defect: Office Name/Post, Relieved Officer, and Relieving Officer are mandatory.");
                }
                return; 
            }

            const loader = document.getElementById('globalAppLoader');
            if(loader) {
                loader.style.display = 'flex';
                document.querySelector('.loading-status-msg').innerText = "Processing General Charge Report...";
            }

            setTimeout(() => {
                try {
                    if (typeof window.jspdf === 'undefined') {
                        alert("System Notice: Please wait a moment for the PDF engine to load, then click generate again.");
                        if(loader) loader.style.display = 'none';
                        return;
                    }

                    const { jsPDF } = window.jspdf; 
                    const doc = new jsPDF('p', 'mm', 'a4'); // Exact Portrait Format

                    const office = document.getElementById('genOfficeName').value;
                    const relieved = document.getElementById('genRelievedOfficer').value;
                    const relieving = document.getElementById('genRelievingOfficer').value;
                    const tDateRaw = document.getElementById('genTransferDate').value;
                    
                    // --- UPDATED LOGIC FOR FULL 'Forenoon' and 'Afternoon' TEXT ---
                    const tTimeRaw = document.getElementById('genTransferTime').value;
                    const tTime = tTimeRaw === 'FN' ? 'Forenoon' : 'Afternoon';
                    // --------------------------------------------------------------

                    const memoNo = document.getElementById('genMemoNo').value;
                    const memoDateRaw = document.getElementById('genMemoDate').value;
                    const authority = document.getElementById('genFromAuthority').value;

                    const formatD = (d) => { if(!d) return ""; const p = d.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };

                    const forwardInputs = document.querySelectorAll('.row-gen-forward-target');
                    let targetRecipients = [];
                    forwardInputs.forEach(input => { let v = input.value.trim(); if(v) targetRecipients.push(v); });
                    if(targetRecipients.length === 0) targetRecipients.push("");

                    // ORIGINAL SPLIT-PAGE LOGIC TO PRINT TWO COPIES PER PAGE
                    const drawHalf = (offsetY, recipient) => {
                        doc.setTextColor(0, 0, 0);
                        doc.setDrawColor(0, 0, 0);
                        doc.setLineWidth(0.3);

                        doc.setFont("times", "bold"); 
                        doc.setFontSize(10); 
                        doc.text("ACG-61", 15, 15 + offsetY);
                        
                        doc.setFontSize(12); 
                        doc.text("DEPARTMENT OF POSTS, INDIA", 105, 22 + offsetY, { align: "center" });
                        
                        doc.setFont("times", "normal"); 
                        doc.setFontSize(8.5);
                        doc.text("(See Rule 267, Posts and Telegraphs Financial Hand book, Volume 1, Second Edition)", 105, 27 + offsetY, { align: "center" });
                        
                        doc.setFont("times", "bold"); 
                        doc.setFontSize(11);
                        doc.text("Charge Report and Receipt of Cash and Stamps on transfer of charge", 105, 36 + offsetY, { align: "center" });
                        doc.line(40, 38 + offsetY, 170, 38 + offsetY);

                        let blockY = 52 + offsetY;
                        
                        doc.setFont("times", "normal");
                        doc.setFontSize(11);
                        doc.text("Certified that the charge of the office of", 15, blockY);
                        doc.line(82, blockY + 1, 195, blockY + 1); 
                        doc.setFont("times", "bold");
                        doc.text(office, 85, blockY);

                        blockY += 10;
                        doc.setFont("times", "normal");
                        doc.text("was made over by", 15, blockY);
                        doc.line(45, blockY + 1, 115, blockY + 1);
                        doc.setFont("times", "bold");
                        doc.text(relieved, 48, blockY);
                        
                        doc.setFont("times", "normal");
                        doc.text("to", 118, blockY);
                        doc.line(125, blockY + 1, 195, blockY + 1);
                        doc.setFont("times", "bold");
                        doc.text(relieving, 128, blockY);

                        blockY += 10;
                        doc.setFont("times", "normal");
                        doc.text("on", 15, blockY);
                        doc.line(21, blockY + 1, 75, blockY + 1);
                        doc.setFont("times", "bold");
                        
                        // --- BRACKET FIX APPLIED HERE ---
                        doc.text(formatD(tDateRaw) + (formatD(tDateRaw) ? " (" + tTime + ")" : ""), 24, blockY);
                        // --------------------------------
                        
                        doc.setFont("times", "normal");
                        doc.text("in accordance with Office Order/ Memorandum/ letter No.", 80, blockY); 
                        
                        blockY += 10;
                        doc.line(15, blockY + 1, 80, blockY + 1);
                        doc.setFont("times", "bold");
                        doc.text(memoNo, 17, blockY);
                        
                        doc.setFont("times", "normal");
                        doc.text("dated", 83, blockY);
                        doc.line(95, blockY + 1, 125, blockY + 1);
                        doc.setFont("times", "bold");
                        doc.text(formatD(memoDateRaw), 97, blockY);
                        
                        doc.setFont("times", "normal");
                        doc.text("from", 128, blockY);
                        doc.line(138, blockY + 1, 195, blockY + 1); 
                        doc.setFont("times", "bold");
                        doc.text(authority, 141, blockY);

                        blockY += 24;
                        doc.text("Relieved Officer", 30, blockY);
                        doc.text("Relieving Officer", 145, blockY);
                        doc.setFont("times", "normal");

                        blockY += 20;
                        doc.setFont("times", "bold"); 
                        doc.text("Copy forwarded to:", 15, blockY);
                        doc.line(15, blockY+1, 46, blockY+1);
                        doc.setFont("times", "normal");

                        if(recipient) {
                            blockY += 8;
                            doc.text("1. " + recipient, 20, blockY);
                        } else {
                            blockY += 8;
                            doc.text("1. ............................................................................................................", 20, blockY);
                        }
                    };

                    for (let i = 0; i < targetRecipients.length; i += 2) {
                        if (i > 0) doc.addPage('a4', 'p');
                        
                        drawHalf(0, targetRecipients[i]);
                        
                        // Center cut line
                        doc.setDrawColor(180, 180, 180); 
                        doc.setLineWidth(0.4);
                        doc.setLineDashPattern([3, 3], 0); 
                        doc.line(15, 148.5, 195, 148.5); 
                        
                        doc.setFillColor(255, 255, 255);
                        doc.rect(95, 146, 20, 5, 'F');
                        
                        doc.setFont("times", "italic");
                        doc.setFontSize(9);
                        doc.setTextColor(140, 140, 140);
                        doc.text("Cut Here", 105, 149.5, { align: "center" });
                        
                        doc.setDrawColor(0, 0, 0);
                        doc.setTextColor(0, 0, 0);
                        doc.setLineDashPattern([], 0);
                        doc.setLineWidth(0.3);

                        if (i + 1 < targetRecipients.length) {
                            drawHalf(148.5, targetRecipients[i+1]);
                        } else {
                            drawHalf(148.5, "Office Copy / Spare");
                        }
                    }

                    // Send to the centered modal preview
                    finalizeLocalViewer(doc);

                } catch (err) {
                    console.error("PDF generation failure: ", err); 
                    if(typeof displayCustomAlert === "function") {
                        displayCustomAlert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    } else {
                        alert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    }
                } finally {
                    if(loader) loader.style.display = 'none';
                }
            }, 750);
        }
    </script>
</div>
