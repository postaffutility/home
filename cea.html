        /* --- PERFECT CENTERED MODAL, FULL SCREEN BLUR --- */
        .pdf-modal-overlay {

                <label>Is spouse employed in Central Govt., PSU, or State Govt.?</label>

    <!-- BEAUTIFUL CENTERED POPUP MODAL FOR PDF PREVIEW -->
    <div id="pdfModalOverlay" class="pdf-modal-overlay">
        <div class="pdf-modal-card">
            <div class="pdf-modal-header">
                <h3>📄 Generated Document Live Preview</h3>
                <button class="pdf-close-btn" onclick="closePdfModal()">❌ Close Preview</button>

    <!-- 100% UNTOUCHED ORIGINAL PDF LOGIC (Adapted for CEA Claim) -->
    <script>
        // Ensure jsPDF loads if standalone
        if (typeof window.jspdf === 'undefined') {
            let script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            document.head.appendChild(script);
        }

        // Add dynamic Child Row Function
        function addNewCEAChildRowLocal() {
            const container = document.getElementById('ceaChildContainer');
            
            if (container.children.length >= 2) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Rule Restriction: CEA can only be claimed for a maximum of two eldest surviving children."); 
                } else {
                    alert("Rule Restriction: CEA can only be claimed for a maximum of two eldest surviving children.");
                }
                return; 
            }
            
            let childIndex = container.children.length + 1; 
            let sequenceLabel = childIndex === 1 ? "1st Child" : "2nd Child";
            
            const newRow = document.createElement('div'); 
            newRow.className = 'cea-child-row'; 
            newRow.style.position = 'relative';
            
            newRow.innerHTML = `
                <div style="width: 100%; border-bottom: 2px solid #cbd5e1; margin-bottom: 15px; padding-bottom: 5px;">
                    <h5 style="margin: 0; color: #8b5cf6; font-size: 15px; display: inline-block;">${sequenceLabel} Details</h5>
                    ${childIndex > 1 ? `<button type="button" class="delete-row-btn" style="float:right; margin-top:-5px;" onclick="this.parentElement.parentElement.remove(); calculateCEATotalLocal();">❌ Remove</button>` : ''}
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label>Name of Child</label>
                    <input type="text" class="cea-child-name text-input-placeholder-gray" placeholder="Child Name" />
                    <input type="hidden" class="cea-child-seq" value="${sequenceLabel}" />
                </div>
                <div style="flex: 1; min-width: 120px;">
                    <label>Date of Birth</label>
                    <input type="date" class="cea-child-dob" />
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <label>Standard / Class</label>
                    <input type="text" class="cea-child-class text-input-placeholder-gray" placeholder="e.g. VI" />
                </div>
                <div style="flex: 1; min-width: 80px;">
                    <label>Section</label>
                    <input type="text" class="cea-child-sec text-input-placeholder-gray" placeholder="e.g. A" />
                </div>
                <div style="flex: 1; min-width: 80px;">
                    <label>Roll No.</label>
                    <input type="text" class="cea-child-roll text-input-placeholder-gray" placeholder="Roll No" />
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <label>Admission No.</label>
                    <input type="text" class="cea-child-adm text-input-placeholder-gray" placeholder="Adm No" />
                </div>
                <div style="flex: 1; min-width: 250px; margin-top: 10px;">
                    <label>School Name</label>
                    <input type="text" class="cea-child-school text-input-placeholder-gray" placeholder="Full name of school" />
                </div>
                <div style="flex: 1; min-width: 150px; margin-top: 10px;">
                    <label>School Place / City</label>
                    <input type="text" class="cea-child-place text-input-placeholder-gray" placeholder="City/Town" />
                </div>
                <div style="flex: 1; min-width: 120px; margin-top: 10px;">
                    <label>Affiliation Reg. No.</label>
                    <input type="text" class="cea-child-affil text-input-placeholder-gray" placeholder="Affiliation No" />
                </div>
                <div style="flex: 1; min-width: 100px; margin-top: 10px;">
                    <label>Curriculum Board</label>
                    <input type="text" class="cea-child-pattern text-input-placeholder-gray" placeholder="e.g. CBSE" />
                </div>
                <div style="flex: 1; min-width: 100px; margin-top: 10px;">
                    <label>Pattern Code</label>
                    <input type="text" class="cea-child-code text-input-placeholder-gray" placeholder="Code" />
                </div>
                <div style="flex: 1; min-width: 150px; margin-top: 10px;">
                    <label>Claim Period</label>
                    <input type="text" class="cea-child-period text-input-placeholder-gray" placeholder="e.g. Apr 2025 - Mar 2026" />
                </div>
                <div style="flex: 1; min-width: 100px; margin-top: 10px;">
                    <label>Rate of CEA</label>
                    <input type="number" class="cea-child-rate text-input-placeholder-gray" placeholder="2250" />
                </div>
                <div style="flex: 1; min-width: 120px; margin-top: 10px;">
                    <label>Amount Claimed</label>
                    <input type="number" class="cea-child-amount text-input-placeholder-gray" oninput="calculateCEATotalLocal()" placeholder="0" />
                </div>
                <div style="flex: 1; min-width: 150px; margin-top: 10px;">
                    <label>Remarks</label>
                    <input type="text" class="cea-child-remark text-input-placeholder-gray" placeholder="e.g. Full Year" value="Full Year Claim"/>
                </div>
            `; 
            container.appendChild(newRow);
        }

        // Auto-add first row if empty
        setTimeout(() => {
            if(document.getElementById('ceaChildContainer').children.length === 0) {
                addNewCEAChildRowLocal();
            }
        }, 100);

        function calculateCEATotalLocal() {
            let total = 0; 
            const amountInputs = document.querySelectorAll('.cea-child-amount');
            
            amountInputs.forEach(input => { 
                let val = parseFloat(input.value); 
                if(!isNaN(val)) {
                    total += val; 
                }
            });
            
            document.getElementById('ceaTotalClaim').value = total;
        }

        function closePdfModal() {
            const overlay = document.getElementById('pdfModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function finalizeLocalViewer(doc) {
            const blobDataUrl = doc.output('datauristring');
            const iframe = document.getElementById('pdfFrameViewerLocal');
            const overlay = document.getElementById('pdfModalOverlay');
            
            // Move overlay to body to cover whole screen perfectly
            if (overlay.parentNode !== document.body) {
                document.body.appendChild(overlay);
            }

            iframe.src = blobDataUrl;
            
            // Show the modal perfectly centered!
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.classList.add('active'); }, 50);
        }

        function triggerSmartGenerationCEA() {
            if (!document.getElementById('ceaEmpName').value) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: Name of Employee is mandatory for CEA.");
                } else {
                    alert("Form Defect: Name of Employee is mandatory for CEA.");
                }
                return; 
            }
            const childRows = document.querySelectorAll('#ceaChildContainer .cea-child-row');
            if (childRows.length === 0) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: You must add at least one child to claim CEA.");
                } else {
                    alert("Form Defect: You must add at least one child to claim CEA.");
                }
                return; 
            }

            const loader = document.getElementById('globalAppLoader');
            if(loader) {
                loader.style.display = 'flex';
                document.querySelector('.loading-status-msg').innerText = "Generating Official Forms...";
            }

            setTimeout(() => {
                try {
                    if (typeof window.jspdf === 'undefined') {
                        alert("System Notice: Please wait a moment for the PDF engine to load, then click generate again.");
                        if(loader) loader.style.display = 'none';
                        return;
                    }

                    // --- EXACT ORIGINAL PDF GENERATION LOGIC ---
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');

                    const getVal = (id) => {
                        const el = document.getElementById(id);
                        return el ? el.value : "";
                    };

                    const fmtDtOnly = (val) => {
                        if(!val) return "";
                        let d = new Date(val);
                        if(isNaN(d)) return val;
                        return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + d.getFullYear();
                    };

                    const children = [];
                    document.querySelectorAll('#ceaChildContainer .cea-child-row').forEach(r => {
                        children.push({
                            name: r.querySelector('.cea-child-name') ? r.querySelector('.cea-child-name').value : "",
                            dob: r.querySelector('.cea-child-dob') ? r.querySelector('.cea-child-dob').value : "",
                            std: r.querySelector('.cea-child-class') ? r.querySelector('.cea-child-class').value : "",
                            sec: r.querySelector('.cea-child-sec') ? r.querySelector('.cea-child-sec').value : "",
                            roll: r.querySelector('.cea-child-roll') ? r.querySelector('.cea-child-roll').value : "",
                            adm: r.querySelector('.cea-child-adm') ? r.querySelector('.cea-child-adm').value : "",
                            school: r.querySelector('.cea-child-school') ? r.querySelector('.cea-child-school').value : "",
                            place: r.querySelector('.cea-child-place') ? r.querySelector('.cea-child-place').value : "",
                            affil: r.querySelector('.cea-child-affil') ? r.querySelector('.cea-child-affil').value : "",
                            pattern: r.querySelector('.cea-child-pattern') ? r.querySelector('.cea-child-pattern').value : "",
                            code: r.querySelector('.cea-child-code') ? r.querySelector('.cea-child-code').value : "",
                            period: r.querySelector('.cea-child-period') ? r.querySelector('.cea-child-period').value : "",
                            rate: r.querySelector('.cea-child-rate') ? r.querySelector('.cea-child-rate').value : "",
                            amount: r.querySelector('.cea-child-amount') ? r.querySelector('.cea-child-amount').value : "",
                            remark: r.querySelector('.cea-child-remark') ? r.querySelector('.cea-child-remark').value : ""
                        });
                    });

                    const empName = getVal('ceaEmpName');
                    const empId = getVal('ceaEmpId');
                    const empDesig = getVal('ceaEmpDesig');
                    const empDept = getVal('ceaEmpDept');
                    const acadYear = getVal('ceaAcadYear');

                    // ==========================================
                    // RENDER PAGE 1: EXACT 100% MATCH
                    // ==========================================
                    doc.setFont("times", "bolditalic");
                    doc.setFontSize(11);
                    doc.text("Annexure 'A'", 195, 18, { align: "right" });
                    doc.line(174, 19, 195, 19);

                    doc.setFontSize(12);
                    doc.text("CEA: Proforma For Re-Imbursement", 105, 26, { align: "center" });
                    doc.line(71, 27, 139, 27);

                    doc.setFontSize(11);
                    doc.text("Proforma For Re-Imbursement of Children Education Allowance Claim for the", 105, 32, { align: "center" });
                    doc.line(28, 33, 182, 33);
                    
                    doc.text("Academic Year:.............................", 105, 38, { align: "center" });
                    doc.line(78, 39, 132, 39);
                    doc.setFont("times", "bold");
                    doc.text(acadYear, 109, 37.5); 

                    doc.setFont("times", "normal");
                    doc.setFontSize(10.5);
                    doc.text("I hereby apply for the reimbursement of Children Education Allowance/ Hostel-Subsidy", 15, 46);
                    doc.text("for my child/Children and relevant particulars are furnished below:", 15, 52);

                    // ==========================================
                    // TABLE 1: EMPLOYEE DETAILS
                    // ==========================================
                    let t1Y = 56;
                    doc.setLineWidth(0.2);
                    doc.rect(15, t1Y, 180, 68); 
                    
                    doc.line(25, t1Y, 25, t1Y + 68);
                    doc.line(100, t1Y, 100, t1Y + 68);
                    doc.line(105, t1Y, 105, t1Y + 68);

                    doc.line(15, t1Y + 8, 195, t1Y + 8);
                    doc.line(15, t1Y + 16, 195, t1Y + 16);
                    doc.line(15, t1Y + 24, 195, t1Y + 24);
                    doc.line(15, t1Y + 32, 195, t1Y + 32);
                    doc.line(15, t1Y + 52, 195, t1Y + 52); 

                    doc.text("1.", 17, t1Y + 5.5); doc.text("Name of Employee", 27, t1Y + 5.5); doc.text(":", 101.5, t1Y + 5.5); doc.text(empName, 107, t1Y + 5.5);
