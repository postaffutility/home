        .pdf-modal-header {

        .pdf-close-btn {

        .pdf-iframe-container { flex: 1; width: 100%; height: 100%; background: #e2e8f0; }

    <!-- 100% UNTOUCHED ORIGINAL PDF LOGIC (Adapted for Holiday) -->
    <script>
        // Ensure jsPDF loads if standalone
        if (typeof window.jspdf === 'undefined') {
            let script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
            document.head.appendChild(script);
        }

        const LOCAL_INDIA_POST_LOGO_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXlVwmm2OUFIPv_sRjEtehJrDPqIS-nbUCLNZU8i4LT-O-V14Wp6hpQGw&s=10";

        function parseNumberToWordsLocal(num) {
            const units = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            let val = parseInt(num, 10); 
            if (isNaN(val) || val === 0) return "Zero only";
            let words = "";
            if (Math.floor(val / 10000000) > 0) { words += parseNumberToWordsLocal(Math.floor(val / 10000000)) + " Crore "; val %= 10000000; }
            if (Math.floor(val / 100000) > 0) { words += parseNumberToWordsLocal(Math.floor(val / 100000)) + " Lakh "; val %= 100000; }
            if (Math.floor(val / 1000) > 0) { words += parseNumberToWordsLocal(Math.floor(val / 1000)) + " Thousand "; val %= 1000; }
            if (Math.floor(val / 100) > 0) { words += parseNumberToWordsLocal(Math.floor(val / 100)) + " Hundred "; val %= 100; }
            if (val > 0) { 
                if (val < 20) { words += units[val]; } 
                else { words += tens[Math.floor(val / 10)]; if (val % 10 > 0) { words += " " + units[val % 10]; } } 
            }
            return words.replace(/\s+/g, ' ').trim();
        }

        // ORIGINAL ENGINE - 100% UNTOUCHED
        function drawStandardVoucherPageLocal(doc, sender, dateString, voucherIndex, amountNum, purposeText) {
            const leftMidX = 73; 
            const amountText = parseNumberToWordsLocal(amountNum) + " only";

            try { 
                doc.addImage(LOCAL_INDIA_POST_LOGO_URL, 'PNG', 132, 5, 10, 10); 
            } catch (err) {
                console.error("Voucher Logo asset render skip background: ", err);
            }

            doc.setFont("times", "bold"); 
            doc.setFontSize(10.5); 
            doc.text("ACG-17", 12, 15); 
            
            doc.setFontSize(11); 
            doc.setFont("times", "bold"); 
            doc.text("DEPARTMENT OF POSTS - INDIA", leftMidX, 15, { align: "center" });
            
            doc.setFont("times", "normal"); 
            doc.setFontSize(7.5); 
            doc.text("(See Note below Rules 6 (b) of Appendix II to Posts and Telegraphs Financial Handbook Volume I)", leftMidX, 20, { align: "center" });
            doc.text("2nd Edition 2nd Reprinting)", leftMidX, 24, { align: "center" });
            
            doc.setFont("times", "bold"); 
            doc.setFontSize(9); 
            doc.text("/Receipt", leftMidX, 30, { align: "center" });
            
            doc.setFont("times", "normal"); 
            doc.setFontSize(9.5); 
            doc.text("The " + dateString, 12, 42); 
            doc.text("Voucher No-" + voucherIndex, 85, 42);

            doc.setFont("times", "bold"); 
            doc.text("Received from", 12, 51); 
            doc.setFont("times", "normal"); 
            doc.text(sender, 45, 51); 
            doc.line(45, 52, 140, 52);

            doc.setFont("times", "bold"); 
            doc.text("The Sum of Rupees", 12, 61); 
            doc.setFont("times", "normal"); 
            doc.text(amountText, 52, 61); 
            doc.line(52, 62, 140, 62);

            doc.setFont("times", "bold"); 
            doc.text("On Account of", 12, 71); 
            doc.setFont("times", "normal");
            
            const wrappedPurpose = doc.splitTextToSize(purposeText, 95);
            for (let i = 0; i < wrappedPurpose.length; i++) { 
                doc.text(wrappedPurpose[i], 44, 71 + (i * 5)); 
                doc.line(44, 72 + (i * 5), 140, 72 + (i * 5)); 
            }

            let offsetHeight = (wrappedPurpose.length - 1) * 5;
            let currentLeftY = 91 + offsetHeight; 
            
            doc.setFont("times", "bold"); 
            doc.setFontSize(10.5); 
            doc.text("/Rs. " + amountNum + "/-", 12, currentLeftY);

            currentLeftY += 15; 
            doc.setFont("times", "bold"); 
            doc.setFontSize(8.5); 
            doc.text("Witnessed Payment", 12, currentLeftY);
            
            currentLeftY += 12; 
            doc.text("Signature of Witness", 12, currentLeftY); 
            doc.text("Signature of Payee", 100, currentLeftY);

            currentLeftY += 10; 
            doc.setFont("times", "normal"); 
            doc.setFontSize(6.5);
            
            let legalText1 = "Note :- If the receipt be not written or not signed in English/Hindi the whole of the portion not in English/Hindi must be translated by the Paying Officer.";
            let legalText2 = "A person signing such receipt in Hindi should be required to indicate his full name in block letters within brackets below his signature.";
            let legalText3 = "If the person paid cannot sign, the payment must be certified by the paying officer and atleast one witness.";
            let legalText4 = "If the amount be paid more than Rs. 5000/- a Receipt Stamp of 1/- must be affixed and this stamp must be paid for by the person to whom the amount of receipt is paid.";
            let legalText5 = "1. Certified that the amount included in the voucher has been disbursed to the proper person.";

            const w1 = doc.splitTextToSize(legalText1, 128); 
            const w2 = doc.splitTextToSize(legalText2, 128);
            const w3 = doc.splitTextToSize(legalText3, 128); 
            const w4 = doc.splitTextToSize(legalText4, 128);
            const w5 = doc.splitTextToSize(legalText5, 128);

            for(let k=0; k<w1.length; k++) { doc.text(w1[k], 12, currentLeftY); currentLeftY += 3.5; }
            for(let k=0; k<w2.length; k++) { doc.text(w2[k], 12, currentLeftY); currentLeftY += 3.5; }
            for(let k=0; k<w3.length; k++) { doc.text(w3[k], 12, currentLeftY); currentLeftY += 3.5; }
            for(let k=0; k<w4.length; k++) { doc.text(w4[k], 12, currentLeftY); currentLeftY += 3.5; }
            
            currentLeftY += 2; 
            doc.line(12, currentLeftY, 140, currentLeftY); 
            currentLeftY += 4;
            
            for(let k=0; k<w5.length; k++) { doc.text(w5[k], 12, currentLeftY); currentLeftY += 3.5; }

            const rightEdgeX = 285; 
            doc.setFontSize(8.5); 
            doc.setFont("times", "bold");
            
            doc.text("Paying", rightEdgeX, 15, { align: "right" }); 
            doc.text("Officer", rightEdgeX, 19, { align: "right" });
            doc.text("Counter", rightEdgeX, 35, { align: "right" }); 
            doc.text("Signed", rightEdgeX, 39, { align: "right" });
            doc.text("Disbursing", rightEdgeX, 54, { align: "right" }); 
            doc.text("Officer", rightEdgeX, 58, { align: "right" });

            let currentRightY = 74; 
            doc.setFont("times", "normal");
            
            let termsText = "2. Received contents and certified that I have satisfied myself that all advances included in receipt form A.C.G. 17 drawn 1 month / 2 months / 3 months previous to this date with the exception of those detailed below (of which the total has been refunded from this receipt) has been disbursed to the proper persons and that their acceptances have been taken & filed in my office with receipt stamps duly cancelled for every payment in excess of Rs. 5000/-";
            
            const wTerms = doc.splitTextToSize(termsText, 132);
            for(let m=0; m<wTerms.length; m++) { 
                doc.text(wTerms[m], 152, currentRightY + (m * 4)); 
            }

            currentRightY += (wTerms.length * 4) + 15;
            doc.setFont("times", "bold");
            doc.text("Disbursing", rightEdgeX, currentRightY, { align: "right" }); 
            doc.text("Officer", rightEdgeX, currentRightY + 4, { align: "right" });

            doc.setDrawColor(180, 180, 180); 
            doc.setLineDashPattern([2, 2], 0); 
            doc.line(146, 5, 146, 205);
            doc.setDrawColor(0, 0, 0); 
            doc.setLineDashPattern([], 0);
        }

        function closePdfModal() {
            const overlay = document.getElementById('pdfModalOverlay');
            overlay.classList.remove('active');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        function finalizeLocalViewer(doc) {
            const blobDataUrl = doc.output('datauristring');
            const iframe = document.getElementById('pdfFrameViewerLocal');
            const overlay = document.getElementById('pdfModalOverlay');
            
            // KEY FIX: Move the overlay to the top-level body so it covers everything including the header!
            if (overlay.parentNode !== document.body) {
                document.body.appendChild(overlay);
            }

            iframe.src = blobDataUrl;
            
            // Show the modal perfectly centered!
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.classList.add('active'); }, 50);
        }

        function triggerSmartGenerationHoliday() {
            if (!document.getElementById('receivedFromHoliday').value || !document.getElementById('amountHoliday').value || !document.getElementById('holidayVoucherPurpose').value) { 
                if(typeof displayCustomAlert === "function") {
                    displayCustomAlert("Form Defect: All fields in the holiday panel must be filled."); 
                } else {
                    alert("Form Defect: All fields must be filled.");
                }
                return; 
            }

            const loader = document.getElementById('globalAppLoader');
            if(loader) {
                loader.style.display = 'flex';
                document.querySelector('.loading-status-msg').innerText = "Processing Document...";
            }

            setTimeout(() => {
                try {
                    // Check if jsPDF exists, wait if not
                    if (typeof window.jspdf === 'undefined') {
                        alert("System Notice: Please wait a moment for the PDF engine to load, then click generate again.");
                        if(loader) loader.style.display = 'none';
                        return;
                    }

                    const { jsPDF } = window.jspdf; 
                    const doc = new jsPDF('l', 'mm', 'a4'); 
                    
                    const sender = document.getElementById('receivedFromHoliday').value; 
                    const amountNum = document.getElementById('amountHoliday').value;
                    const mVal = document.getElementById('selectMonthHoliday').value; 
                    const yVal = document.getElementById('selectYearHoliday').value;
                    const holidayStr = document.getElementById('holidaysInput').value; 
                    const currentPurpose = document.getElementById('holidayVoucherPurpose').value;

                    // Perfect calculation for leap years and 30/31 days months
                    const maxDays = new Date(parseInt(yVal, 10), parseInt(mVal, 10), 0).getDate();
                    let explicitHolidays = holidayStr.split(",").map(tok => parseInt(tok.trim(), 10)).filter(num => !isNaN(num));

                    let voucherIndex = 1; 
                    let isChainedPage = false;
                    let generatedAny = false;

                    for (let processingDay = 1; processingDay <= maxDays; processingDay++) {
                        const targetDate = new Date(parseInt(yVal, 10), parseInt(mVal, 10) - 1, processingDay);
                        
                        // Check if Sunday (0) OR explicit holiday
                        if (targetDate.getDay() === 0 || explicitHolidays.includes(processingDay)) {
                            if (isChainedPage) { doc.addPage('a4', 'l'); } 
                            isChainedPage = true;
                            generatedAny = true;

                            const finalDateString = (processingDay < 10 ? "0" + processingDay : processingDay) + "/" + mVal + "/" + yVal;
                            
                            // Exact original rendering engine call
                            drawStandardVoucherPageLocal(doc, sender, finalDateString, voucherIndex, amountNum, currentPurpose);
                            voucherIndex++;
                        }
                    }
                    
                    if(!generatedAny) {
                         if(typeof displayCustomAlert === "function") displayCustomAlert("Generation Notice: No valid Sundays or holidays were found for the selected month.");
                         else alert("Generation Notice: No valid Sundays or holidays were found for the selected month.");
                         return;
                    }

                    // Send to the centered modal preview
                    finalizeLocalViewer(doc);
                    
                } catch (err) {
                    console.error("PDF generation failure: ", err); 
                    if(typeof displayCustomAlert === "function") {
                        displayCustomAlert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    } else {
                        alert("Engine Failure Error: Failed to successfully output compile final PDF.");
                    }
                } finally {
                    if(loader) loader.style.display = 'none';
                }
            }, 750);
        }
    </script>
