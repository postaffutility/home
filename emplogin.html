<!-- emplogin.html (Employee Login Report Module) -->
<script>
    if (!document.getElementById("dynamicWorkspace") || window.location.pathname.endsWith("emplogin.html")) {
        window.location.href = "index.html";
    }
</script>

<div id="moduleRenderArea">
    
    <!-- External Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        .sp-page-panel { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; animation: spFadeIn 0.3s ease-out forwards; }
        
        .sp-module-title { margin: 0; color: #1e293b; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .sp-back-nav { display: inline-flex; align-items: center; color: #3b82f6; font-weight: 800; font-size: 15px; text-decoration: none; cursor: pointer; transition: color 0.2s; padding: 8px 16px; background: #eff6ff; border-radius: 8px; float: right; border: 1px solid #bfdbfe; }
        .sp-back-nav:hover { color: #1d4ed8; background: #dbeafe; transform: translateX(-2px); }

        .sp-form-group { margin-bottom: 22px; text-align: left; }
        .sp-form-group label { display: block; font-weight: 800; margin-bottom: 10px; font-size: 14.5px; color: #334155; }
        
        .sp-input { width: 100%; padding: 16px 20px; box-sizing: border-box; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; background: #f8fafc; color: #1e293b !important; transition: all 0.3s ease; font-weight: 700; font-family: 'Segoe UI', Arial, sans-serif; }
        .sp-input:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); outline: none;}
        
        .sp-action-btn { width: 100%; padding: 18px; color: white; border: none; border-radius: 12px; font-size: 15.5px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; transition: all 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .sp-action-btn.blue { background: #3b82f6; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25); }
        .sp-action-btn.blue:hover { background: #2563eb; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35); }
        .sp-action-btn.red { background: #ef4444; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25); }
        .sp-action-btn.red:hover { background: #dc2626; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(220, 38, 38, 0.35); }
        .sp-action-btn.green { background: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25); }
        .sp-action-btn.green:hover { background: #059669; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35); }

        /* Floating Toast Notification CSS */
        .el-toast-container { position: fixed; top: 30px; right: 30px; z-index: 100000000; display: flex; flex-direction: column; gap: 15px; pointer-events: none; }
        .el-toast { background: #ffffff; border-left: 6px solid #3b82f6; box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 18px 25px; border-radius: 10px; font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 14px; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
        .el-toast.show { transform: translateX(0); }
        .el-toast.success { border-left-color: #10b981; }
        .el-toast.error { border-left-color: #ef4444; }
        .el-toast.warning { border-left-color: #f59e0b; }

        @keyframes spFadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <div class='sp-page-panel' id="elMainDashboard">
        <div style="margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; overflow: hidden;">
            <div class='sp-back-nav' onclick='typeof returnToHomeGridSPA === "function" ? returnToHomeGridSPA() : window.history.back()'>⬅️ Back to Reports</div>
            <h3 class="sp-module-title">🔐 Employee Login Report</h3>
            <p style="color: #64748b; font-size: 15px; margin-top: 8px; font-weight: 500;">Generate detailed login audits and access history for your jurisdiction.</p>
        </div>

        <div style="border-top: 4px solid #3b82f6; background: #ffffff; border-radius: 16px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid #e2e8f0;">
            
            <div style="background: #eff6ff; padding: 25px; border-radius: 12px; border: 1px solid #bfdbfe; margin-bottom: 25px;">
                <p id="elAccessNote" style="margin: 0 0 15px 0; font-size: 13.5px; color: #1d4ed8; font-weight: 800;">Loading Access Rights...</p>
                
                <div class="sp-form-group" style="margin-bottom: 0;">
                    <label style="color: #1e40af;">Select Date</label>
                    <div style="display: flex; gap: 15px;">
                        <input id="elReportDate" type="date" class="sp-input" style="border-color: #93c5fd; flex: 2;">
                        <button class="sp-action-btn blue" style="margin-top: 0; flex: 1;" onclick="window.elValidateData()">Validate & Fetch</button>
                    </div>
                    <span style="font-size: 12px; color: #64748b; font-weight: bold; margin-top: 8px; display: inline-block;">Note: System only retains recent active session logs. Select today's date for accurate results.</span>
                </div>
            </div>

            <!-- Export Area (Hidden initially) -->
            <div id="elExportContainer" style="display: none; animation: spFadeIn 0.3s ease-out; padding-top: 20px; border-top: 2px dashed #e2e8f0;">
                <h4 style="margin: 0 0 15px 0; color: #0f172a; font-size: 16px; display: flex; justify-content: space-between; align-items: center;">
                    <span>📊 Data Validated Successfully</span>
                    <span id="elRecordCount" style="background: #dbeafe; color: #1d4ed8; padding: 4px 12px; border-radius: 20px; font-size: 13px;">0 Records Found</span>
                </h4>
                
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button class="sp-action-btn red" onclick="window.elGeneratePDF()">📄 Preview PDF Report</button>
                    <button class="sp-action-btn green" onclick="window.elGenerateExcel()">📊 Export to Excel</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // =========================================================
        // FLOATING TOAST NOTIFICATION ENGINE
        // =========================================================
        window.elShowToast = function(msg, type="success") {
            let container = document.getElementById('elToastContainer');
            if(!container) {
                container = document.createElement('div');
                container.id = 'elToastContainer';
                container.className = 'el-toast-container';
                document.body.appendChild(container);
            }
            
            let toast = document.createElement('div');
            toast.className = `el-toast ${type}`;
            let icon = type === 'success' ? '✅' : (type === 'error' ? '❌' : '⚠️');
            toast.innerHTML = `<span style="font-size:22px;">${icon}</span> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        };

        // =========================================================
        // CORE LOGIC & VARIABLES
        // =========================================================
        window.elData = {
            users: [],
            offices: [],
            logs: [],
            filteredLogs: [],
            activeUser: sessionStorage.getItem("activeUser"),
            activeSolId: null // Dynamically fetched to prevent [null] bug
        };

        window.initEmpLoginReport = function() {
            // Restrict Date Input to Today
            const dateInput = document.getElementById('elReportDate');
            const today = new Date();
            const istDateStr = new Date(today.toLocaleString("en-US", {timeZone: "Asia/Kolkata"})).toISOString().split('T')[0];
            dateInput.value = istDateStr;
            dateInput.max = istDateStr;

            let db = typeof firebase !== 'undefined' ? firebase.firestore() : null;
            if(!db) { window.elShowToast("Database connection error.", "error"); return; }

            // Fetch live registry data
            db.collection("system").doc("registry").onSnapshot(doc => {
                if(doc.exists) {
                    let data = doc.data();
                    window.elData.users = data.users || [];
                    window.elData.offices = data.offices || [];
                    window.elData.logs = data.logs || [];
                    
                    // FIX: Dynamically assign active SOL ID to fix the [null] bug
                    if(window.elData.activeUser === "admin") {
                        window.elData.activeSolId = "000000";
                    } else {
                        let activeProfile = window.elData.users.find(u => u.user === window.elData.activeUser);
                        if(activeProfile) {
                            window.elData.activeSolId = activeProfile.solId;
                        }
                    }

                    let isHQ = (window.elData.activeSolId === '000000' || window.elData.activeUser === 'admin');
                    let note = document.getElementById('elAccessNote');
                    if(isHQ) {
                        note.innerText = "HQ Access: You are generating reports for all branches.";
                        note.style.color = "#8b5cf6"; 
                    } else {
                        note.innerText = `Branch Access: Report restricted to employees of SOL [${window.elData.activeSolId}].`;
                        note.style.color = "#3b82f6";
                    }
                }
            });
        };

        window.elValidateData = function() {
            let inputDate = document.getElementById('elReportDate').value; // "YYYY-MM-DD"
            let container = document.getElementById('elExportContainer');
            
            if(!inputDate) {
                window.elShowToast("Please select a date to fetch logs.", "error");
                container.style.display = 'none';
                return;
            }

            // --- BULLETPROOF DATE MATCHING ENGINE ---
            let dateParts = inputDate.split('-');
            let tY = parseInt(dateParts[0]);
            let tM = parseInt(dateParts[1]);
            let tD = parseInt(dateParts[2]);

            // Formats to match variations like 06/09/2026 or 6/9/2026
            let f1 = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`; 
            let f2 = `${tD}/${tM}/${tY}`; 
            let f3 = `${dateParts[1]}/${dateParts[2]}/${dateParts[0]}`; 
            let f4 = `${tM}/${tD}/${tY}`; 

            let isHQ = (window.elData.activeSolId === '000000' || window.elData.activeUser === 'admin');
            let processedData = [];

            window.elData.logs.forEach(log => {
                let logTimeStr = log.time.toLowerCase();
                let logMatchesDate = false;

                // Smart Extraction
                let dateSegment = log.time.split(',')[0].trim().split(' ')[0].trim();
                let p = dateSegment.split(/[\/\-]/);
                if(p.length >= 3) {
                    let p1 = parseInt(p[0]);
                    let p2 = parseInt(p[1]);
                    let p3 = parseInt(p[2]);
                    if(p3 === tY || p3 === (tY % 100)) {
                        if((p1 === tD && p2 === tM) || (p1 === tM && p2 === tD)) {
                            logMatchesDate = true;
                        }
                    }
                }

                // Fallback string matching
                if(!logMatchesDate && (logTimeStr.includes(f1) || logTimeStr.includes(f2) || logTimeStr.includes(f3) || logTimeStr.includes(f4) || logTimeStr.includes(inputDate))) {
                    logMatchesDate = true;
                }

                if(logMatchesDate) {
                    let uProfile = window.elData.users.find(u => u.user === log.user);
                    let solId = uProfile ? uProfile.solId : "UNMAPPED";
                    let empName = uProfile ? uProfile.fullName : "Unknown";

                    // Branch Admin restriction check
                    if (!isHQ && solId !== window.elData.activeSolId) return;

                    let office = window.elData.offices.find(o => o.solId === solId);
                    let solName = office ? office.name : "Unknown Office";

                    let isFailed = log.event.toLowerCase().includes("failed") || log.event.toLowerCase().includes("invalid");
                    let ipAddress = isFailed && log.ip ? log.ip : "N/A";

                    processedData.push({
                        username: `@${log.user}`,
                        empName: empName,
                        solId: solId,
                        solName: solName,
                        event: log.event,
                        time: log.time.split(', ')[1] || log.time, 
                        ip: ipAddress
                    });
                }
            });

            if(processedData.length === 0) {
                window.elShowToast("No login records found for the selected date.", "warning");
                container.style.display = 'none';
            } else {
                window.elData.filteredLogs = processedData;
                document.getElementById('elRecordCount').innerText = `${processedData.length} Logs Found`;
                container.style.display = 'block';
                window.elShowToast("Data validated successfully. Ready for export.", "success");
            }
        };

        window.elGeneratePDF = function() {
            if (window.elData.filteredLogs.length === 0) return;
            const { jsPDF } = window.jspdf; 
            const doc = new jsPDF('l', 'mm', 'a4'); 
            const pageWidth = doc.internal.pageSize.getWidth();

            // Premium Header (Center Aligned)
            doc.setFont("times", "bold"); 
            doc.setFontSize(22); 
            doc.setTextColor(37, 99, 235); // Blue Color for Title
            doc.text("PO STAFF UTILITY TOOL", pageWidth / 2, 20, { align: "center" });
            
            doc.setFont("times", "normal"); 
            doc.setFontSize(14); 
            doc.setTextColor(71, 85, 105); 
            doc.text("Employee Login Report", pageWidth / 2, 28, { align: "center" });
            
            // Meta Info (Left Aligned)
            doc.setFontSize(10); 
            doc.setFont("helvetica", "normal"); 
            doc.setTextColor(15, 23, 42);
            doc.text(`Date of Report: ${document.getElementById('elReportDate').value}`, 14, 40);
            doc.text(`Generated by: @${window.elData.activeUser} (IST)`, 14, 45);

            // Table Data Mapping
            const tableData = window.elData.filteredLogs.map((log, index) => [
                index + 1, 
                log.username, 
                log.empName, 
                log.solId, 
                log.solName, 
                log.event, 
                log.time,
                log.ip
            ]);

            doc.autoTable({ 
                startY: 55, 
                head: [['#', 'Username ID', 'Employee Name', 'SOL ID', 'SOL Name', 'Login History/Event', 'Time (IST)', 'IP Address']], 
                body: tableData, 
                theme: 'grid', 
                headStyles: { fillColor: [59, 130, 246] }, // Blue Header
                styles: { fontSize: 9 }
            }); 
            
            // PREVIEW MODE 
            window.open(doc.output('bloburl'), '_blank');
            window.elShowToast("PDF Preview Generated Successfully!", "success");
        };

        window.elGenerateExcel = function() {
            if (window.elData.filteredLogs.length === 0) return;

            // Map data to neat JSON for Excel
            const excelData = window.elData.filteredLogs.map(log => ({
                "Username (ID)": log.username,
                "Employee Name": log.empName,
                "SOL ID": log.solId,
                "SOL Name": log.solName,
                "Login Event Status": log.event,
                "Time (IST)": log.time,
                "IP Address (If Failed)": log.ip
            }));

            const ws = XLSX.utils.json_to_sheet(excelData);
            const wb = XLSX.utils.book_new(); 
            XLSX.utils.book_append_sheet(wb, ws, "Login Report"); 
            
            XLSX.writeFile(wb, `Employee_Login_Report_${document.getElementById('elReportDate').value}.xlsx`);
            window.elShowToast("Excel Downloaded Successfully!", "success");
        };

        // Boot
        window.initEmpLoginReport();
    </script>
</div>
